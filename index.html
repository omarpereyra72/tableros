<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROOT@TERMINAL :: SISTEMA DE ACCESO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

:root{
  --bg:#000000;
  --green:#00ff41;
  --green-dim:#0a5c22;
  --green-glow:#39ff14;
  --amber:#ffb000;
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  background:var(--bg);
  color:var(--green);
  font-family:'Share Tech Mono', monospace;
  height:100%;
  overflow:hidden;
}

/* ===== BACKGROUND LOG STREAM ===== */
#logstream{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  z-index:0;
  opacity:0.30;
  overflow:hidden;
  padding:20px;
  font-size:13px;
  line-height:1.65;
  color:var(--green-dim);
  pointer-events:none;
  mask-image:linear-gradient(to bottom, transparent 0%, black 12%, black 88%, transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom, transparent 0%, black 12%, black 88%, transparent 100%);
}
#logstream .logline{white-space:pre; opacity:0; animation:logfade .4s forwards;}
#logstream .logline .tag{color:var(--amber);}
@keyframes logfade{ from{opacity:0;} to{opacity:1;} }

/* ===== SCROLLING TICKER ===== */
.ticker-wrap{
  position:fixed;
  left:0; width:100%;
  overflow:hidden;
  height:26px;
  background:rgba(0,20,5,0.85);
  border-top:1px solid var(--green-dim);
  border-bottom:1px solid var(--green-dim);
  z-index:5;
  white-space:nowrap;
}
.ticker-wrap.top{top:0;}
.ticker-wrap.bottom{bottom:0;}
.ticker{
  display:inline-block;
  padding-left:100%;
  font-size:13px;
  color:var(--green-dim);
  animation:ticker-scroll 90s linear infinite;
  text-shadow:0 0 4px var(--green-dim);
}
.ticker-wrap.bottom .ticker{animation-duration:110s;}
@keyframes ticker-scroll{
  0%{transform:translateX(0);}
  100%{transform:translateX(-100%);}
}

/* ===== LOGIN GATE ===== */
#login{
  position:fixed; inset:0;
  background:#000;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Share Tech Mono', monospace;
}
#login-box{
  width:min(520px, 90vw);
  border:1px solid var(--green-dim);
  padding:28px 26px;
  box-shadow:0 0 30px rgba(0,255,65,0.15);
}
.login-line{
  color:var(--green);
  font-size:14px;
  margin-bottom:10px;
  letter-spacing:0.5px;
}
.login-line:first-child{
  color:var(--green-glow);
  text-shadow:0 0 8px var(--green-glow);
  letter-spacing:1px;
}
.login-prompt{
  display:flex;
  align-items:center;
  margin-top:18px;
  font-size:15px;
  color:var(--green-glow);
}
#loginInput{
  background:transparent;
  border:none;
  outline:none;
  color:var(--green-glow);
  font-family:'Share Tech Mono', monospace;
  font-size:15px;
  width:200px;
  letter-spacing:3px;
  text-shadow:0 0 6px var(--green-glow);
}
#login-cursor{
  animation:blink 1s step-end infinite;
  color:var(--green-glow);
}
.login-error{
  margin-top:14px;
  font-size:12px;
  color:#ff3333;
  min-height:16px;
  text-shadow:0 0 6px #ff3333;
}
.shake{ animation:shakeErr .35s; }
@keyframes shakeErr{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-8px);}
  40%{transform:translateX(8px);}
  60%{transform:translateX(-6px);}
  80%{transform:translateX(6px);}
}
#boot{
  position:fixed; inset:0;
  background:#000;
  z-index:100;
  padding:40px;
  font-family:'Share Tech Mono', monospace;
  font-size:15px;
  color:var(--green);
  line-height:1.6;
  overflow:hidden;
}
#boot .line{opacity:0; white-space:pre;}
#boot-cursor{display:inline-block;width:9px;height:16px;background:var(--green);animation:blink 1s step-end infinite;vertical-align:middle;}

/* ===== MAIN APP ===== */
#app{
  position:fixed;
  top:30px; bottom:30px; left:0; right:0;
  z-index:10;
  display:none;
  padding:18px 26px;
  overflow-y:auto;
}
#app.visible{display:block;}

.crt-flicker{
  animation:flicker 6s infinite;
}
@keyframes flicker{
  0%,96%,100%{opacity:1;}
  97%{opacity:0.92;}
  98%{opacity:1;}
  99%{opacity:0.96;}
}

.scanlines{
  position:fixed; inset:0;
  z-index:20;
  pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    rgba(0,0,0,0.15) 0px,
    rgba(0,0,0,0.15) 1px,
    transparent 2px,
    transparent 3px
  );
}

.vignette{
  position:fixed; inset:0;
  z-index:19;
  pointer-events:none;
  box-shadow:inset 0 0 180px rgba(0,0,0,0.85);
}

@keyframes blink{
  0%,50%{opacity:1;}
  51%,100%{opacity:0;}
}

/* ===== HEADER ASCII ===== */
.ascii-header{
  font-family:'VT323', monospace;
  font-size:15px;
  line-height:1.05;
  color:var(--green-glow);
  text-shadow:0 0 8px var(--green-glow);
  white-space:pre;
  margin-bottom:6px;
}
.subhead{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  border-bottom:1px solid var(--green-dim);
  padding-bottom:10px;
  margin-bottom:18px;
  flex-wrap:wrap;
  gap:10px;
}
.subhead .status{
  font-size:12px;
  color:var(--green-dim);
}
.subhead .status span{color:var(--green-glow);}
#clock{color:var(--amber); text-shadow:0 0 6px var(--amber);}

/* ===== TOOLBAR ===== */
.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.btn{
  background:transparent;
  border:1px solid var(--green);
  color:var(--green);
  font-family:'Share Tech Mono', monospace;
  font-size:13px;
  padding:8px 14px;
  cursor:pointer;
  text-transform:uppercase;
  letter-spacing:1px;
  transition:all .15s;
}
.btn:hover{
  background:var(--green);
  color:#000;
  box-shadow:0 0 12px var(--green-glow);
}
.btn.danger{border-color:#ff3333; color:#ff3333;}
.btn.danger:hover{background:#ff3333; color:#000; box-shadow:0 0 12px #ff3333;}
.btn.amber{border-color:var(--amber); color:var(--amber);}
.btn.amber:hover{background:var(--amber); color:#000; box-shadow:0 0 12px var(--amber);}

#search{
  background:#000;
  border:1px solid var(--green-dim);
  color:var(--green);
  font-family:'Share Tech Mono', monospace;
  padding:8px 12px;
  font-size:13px;
  flex:1;
  min-width:200px;
}
#search:focus{outline:none; border-color:var(--green); box-shadow:0 0 8px var(--green-dim);}
#search::placeholder{color:var(--green-dim);}

/* ===== DIRECTORY TREE ===== */
.category{
  border:1px solid var(--green-dim);
  margin-bottom:14px;
  background:rgba(0,15,5,0.55);
}
.category-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 14px;
  cursor:pointer;
  background:rgba(0,40,15,0.4);
}
.category-head:hover{background:rgba(0,60,20,0.5);}
.category-name{
  font-size:15px;
  letter-spacing:1px;
}
.category-name::before{content:"▸ ";}
.category.open .category-name::before{content:"▾ ";}
.category-count{
  font-size:11px;
  color:var(--green-dim);
  margin-left:8px;
}
.category-actions{display:flex; gap:6px;}
.mini-btn{
  background:none;
  border:1px solid var(--green-dim);
  color:var(--green-dim);
  font-size:11px;
  padding:3px 8px;
  cursor:pointer;
  font-family:'Share Tech Mono', monospace;
}
.mini-btn:hover{color:var(--green); border-color:var(--green);}
.mini-btn.danger:hover{color:#ff3333; border-color:#ff3333;}

.links-list{
  display:none;
  padding:6px 0 6px 0;
}
.category.open .links-list{display:block;}

.link-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 14px 8px 30px;
  border-top:1px solid rgba(10,92,34,0.4);
  font-size:13px;
  gap:10px;
}
.link-row:hover{background:rgba(0,60,20,0.3);}
.link-main{display:flex; flex-direction:column; gap:2px; overflow:hidden;}
.link-title{color:var(--green-glow); text-decoration:none; cursor:pointer;}
.link-title:hover{text-shadow:0 0 6px var(--green-glow);}
.link-title::before{content:"$ ";color:var(--amber);}
.link-meta{font-size:11px; color:var(--green-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.link-tags{font-size:11px; color:var(--amber); opacity:0.8;}
.link-actions{display:flex; gap:6px; flex-shrink:0;}

.empty-msg{
  padding:14px;
  font-size:12px;
  color:var(--green-dim);
  font-style:italic;
}

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(0,0,0,0.8);
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-overlay.visible{display:flex;}
.modal{
  background:#000;
  border:1px solid var(--green);
  box-shadow:0 0 30px var(--green-dim);
  width:min(460px, 92vw);
  padding:20px;
  max-height:85vh;
  overflow-y:auto;
}
.modal h3{
  font-size:15px;
  margin-bottom:16px;
  color:var(--green-glow);
  border-bottom:1px solid var(--green-dim);
  padding-bottom:8px;
  letter-spacing:1px;
}
.modal h3::before{content:"> ";}
.field{margin-bottom:12px;}
.field label{
  display:block;
  font-size:11px;
  color:var(--green-dim);
  margin-bottom:4px;
  text-transform:uppercase;
}
.field input, .field select, .field textarea{
  width:100%;
  background:#000;
  border:1px solid var(--green-dim);
  color:var(--green);
  font-family:'Share Tech Mono', monospace;
  padding:8px 10px;
  font-size:13px;
}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none; border-color:var(--green); box-shadow:0 0 8px var(--green-dim);
}
.field textarea{resize:vertical; min-height:50px;}
.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:16px;
}

/* file input hidden */
#importFile{display:none;}

/* scrollbar */
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-track{background:#000;}
::-webkit-scrollbar-thumb{background:var(--green-dim);}

@media (max-width:600px){
  .ascii-header{font-size:10px;}
  #app{padding:12px;}
}
</style>
</head>
<body>

<div id="logstream"></div>
<div class="scanlines"></div>
<div class="vignette"></div>

<div class="ticker-wrap top"><div class="ticker" id="tickerTop"></div></div>
<div class="ticker-wrap bottom"><div class="ticker" id="tickerBottom"></div></div>

<div id="login">
  <div id="login-box">
    <div class="login-line">SISTEMA PROTEGIDO — INGRESO RESTRINGIDO</div>
    <div class="login-line">introduzca clave de acceso para continuar:</div>
    <div class="login-prompt">
      <span>root@terminal:~$&nbsp;</span>
      <input type="password" id="loginInput" autocomplete="off" spellcheck="false">
      <span id="login-cursor">▌</span>
    </div>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="boot"></div>

<div id="app" class="crt-flicker">
  <div class="ascii-header" id="asciiHeader"></div>

  <div class="subhead">
    <div class="status">STATUS: <span>CONECTADO</span> &nbsp;|&nbsp; USUARIO: <span>root</span> &nbsp;|&nbsp; NODOS: <span id="nodeCount">0</span></div>
    <div id="clock">--:--:--</div>
  </div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="grep -i buscar por título, tag o categoría...">
    <button class="btn" onclick="openCategoryModal()">+ categoría</button>
    <button class="btn" onclick="openLinkModal()">+ link</button>
    <button class="btn amber" onclick="exportData()">exportar .json</button>
    <button class="btn amber" onclick="document.getElementById('importFile').click()">importar .json</button>
    <button class="btn danger" onclick="confirmReset()">reset</button>
    <input type="file" id="importFile" accept=".json" onchange="importData(event)">
  </div>

  <div id="tree"></div>
</div>

<!-- CATEGORY MODAL -->
<div class="modal-overlay" id="categoryModalOverlay">
  <div class="modal">
    <h3 id="categoryModalTitle">nueva_categoria</h3>
    <div class="field">
      <label>nombre</label>
      <input type="text" id="categoryNameInput" placeholder="ej: OSINT">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeCategoryModal()">cancelar</button>
      <button class="btn amber" onclick="saveCategory()">guardar</button>
    </div>
  </div>
</div>

<!-- LINK MODAL -->
<div class="modal-overlay" id="linkModalOverlay">
  <div class="modal">
    <h3 id="linkModalTitle">nuevo_link</h3>
    <div class="field">
      <label>categoría</label>
      <select id="linkCategorySelect"></select>
    </div>
    <div class="field">
      <label>título</label>
      <input type="text" id="linkTitleInput" placeholder="nombre visible del recurso">
    </div>
    <div class="field">
      <label>url</label>
      <input type="text" id="linkUrlInput" placeholder="https://...">
    </div>
    <div class="field">
      <label>tags (separados por coma)</label>
      <input type="text" id="linkTagsInput" placeholder="seguridad, red, herramienta">
    </div>
    <div class="field">
      <label>observación</label>
      <textarea id="linkDescInput" placeholder="nota opcional"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeLinkModal()">cancelar</button>
      <button class="btn amber" onclick="saveLink()">guardar</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   DATA LAYER
========================================================= */
const STORAGE_KEY = 'hacker_portal_data_v1';

function defaultData(){
  return {
    categories: [
      {
        id: cryptoId(),
        name: 'SISTEMA',
        open: true,
        links: [
          { id: cryptoId(), title: 'Anthropic Console', url: 'https://console.anthropic.com', tags: ['ia','panel'], desc: 'Panel de control de API.' }
        ]
      }
    ]
  };
}

function cryptoId(){
  return 'x' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const parsed = JSON.parse(raw);
    if(!parsed.categories) return defaultData();
    return parsed;
  }catch(e){
    return defaultData();
  }
}

function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadData();

/* =========================================================
   BOOT SEQUENCE
========================================================= */
const bootLines = [
  'INICIANDO NUCLEO DEL SISTEMA...',
  'BOOTING KERNEL MODULES... [OK]',
  'MONTANDO /dev/root ... [OK]',
  'VERIFICANDO INTEGRIDAD DE FIRMWARE... [OK]',
  'ESTABLECIENDO ENLACE SEGURO...',
  'CONEXION SSH root@10.0.0.1 :: ESTABLECIDA',
  'DESENCRIPTANDO PARTICION DE DATOS...',
  'CARGANDO PROTOCOLO DE ACCESO...',
  '',
  'ACCESO CONCEDIDO.',
  'BIENVENIDO, root.'
];

function runBoot(){
  const boot = document.getElementById('boot');
  let delay = 150;
  bootLines.forEach((text, i) => {
    const div = document.createElement('div');
    div.className = 'line';
    div.textContent = text;
    boot.appendChild(div);
    setTimeout(()=>{ div.style.opacity = 1; }, delay);
    delay += text.length === 0 ? 200 : 260 + Math.random()*180;
  });
  const cursorLine = document.createElement('div');
  cursorLine.className = 'line';
  cursorLine.style.opacity = 1;
  const cursor = document.createElement('span');
  cursor.id = 'boot-cursor';
  cursorLine.appendChild(document.createTextNode('root@terminal:~# '));
  cursorLine.appendChild(cursor);
  boot.appendChild(cursorLine);

  setTimeout(()=>{
    boot.style.transition = 'opacity .6s';
    boot.style.opacity = 0;
    setTimeout(()=>{
      boot.style.display = 'none';
      document.getElementById('app').classList.add('visible');
      renderAll();
    }, 600);
  }, delay + 700);
}

/* =========================================================
   BACKGROUND LOG STREAM
========================================================= */
const logEnPhrases = ['scanning subnet','handshake complete','session token refreshed','process forked','packet inspected','route optimized','cache invalidated','node heartbeat ok','queue flushed','thread pool resized','checksum verified','port scan finished','buffer allocated','signal received','job dispatched'];
const logEuPhrases = ['sarea eskaneatzen','konexioa ezarrita','saioa berritu da','prozesua abiatuta','paketea aztertuta','bidea optimizatuta','memoria esleitua','ataka eskaneatua','seinalea jasota','lana bidalita','datu-basea sinkronizatuta','erregistroa gordeta'];

function logHex(len){
  let s='';
  for(let i=0;i<len;i++) s += Math.floor(Math.random()*16).toString(16);
  return s;
}
function logIp(){
  return Array.from({length:4},()=>Math.floor(Math.random()*255)).join('.');
}
function timestamp(){
  const d = new Date();
  return d.toTimeString().slice(0,8);
}

function buildLogLine(){
  const r = Math.random();
  const tagPool = ['INFO','SYNC','NET','PROC','SEC','EN','EU'];
  const tag = tagPool[Math.floor(Math.random()*tagPool.length)];
  let body;
  if(r < 0.35) body = logEnPhrases[Math.floor(Math.random()*logEnPhrases.length)];
  else if(r < 0.6) body = logEuPhrases[Math.floor(Math.random()*logEuPhrases.length)];
  else if(r < 0.8) body = `pid:${Math.floor(Math.random()*9000)+100} addr:${logIp()} sum:0x${logHex(8)}`;
  else body = `mem[0x${logHex(6)}] -> ${Math.floor(Math.random()*4096)} bytes`;
  return `[${timestamp()}] [${tag}] ${body}`;
}

const logstream = document.getElementById('logstream');
const MAX_LOG_LINES = 40;

function appendLogLine(){
  const div = document.createElement('div');
  div.className = 'logline';
  const line = buildLogLine();
  const tagMatch = line.match(/^(\[[\d:]+\]) (\[\w+\])/);
  div.textContent = line;
  logstream.appendChild(div);
  while(logstream.children.length > MAX_LOG_LINES){
    logstream.removeChild(logstream.firstChild);
  }
}

for(let i=0;i<MAX_LOG_LINES;i++) appendLogLine();
setInterval(appendLogLine, 700);

/* =========================================================
   TICKER TEXT (EN / EU / calculos)
========================================================= */
const enWords = ['ACCESS GRANTED','SYSTEM BREACH DETECTED','ENCRYPTING PAYLOAD','FIREWALL BYPASSED','ROOT PRIVILEGES ACQUIRED','SCANNING NETWORK','INJECTING PACKET','DECRYPTING TOKEN','UPLINK ESTABLISHED','TRACE ROUTE COMPLETE','KERNEL PANIC AVERTED','PROXY CHAIN ACTIVE','BUFFER OVERFLOW','NODE SYNCHRONIZED','MAINFRAME ONLINE','HASH COLLISION FOUND','BACKDOOR INSTALLED','CIPHER KEY ROTATED','LATENCY 12ms','BANDWIDTH 940Mb/s'];
const euWords = ['SARBIDEA BAIMENDUTA','SISTEMA HAUSTEA DETEKTATUA','SAREA ESKANEATZEN','ZERBITZARIA KONEKTATUTA','DATUAK ENKRIPTATZEN','ERABILTZAILEA EGIAZTATUTA','PASAHITZA GAKO BERRIA','KONEXIOA EZARRITA','MEMORIA ESLEITUTA','FITXATEGIA DESZIFRATZEN','ATEA IREKITA','PROGRAMA EXEKUTATZEN','SEGURTASUN PROTOKOLOA','GILTZA BERRIA SORTU DA','MEZUA BIDALITA','ETENA EGINDA','SISTEMA EGONKORRA'];

function randomHex(len){
  let s='0x';
  for(let i=0;i<len;i++) s += Math.floor(Math.random()*16).toString(16);
  return s.toUpperCase();
}
function randomCalc(){
  const ops = ['+','-','*','^','%'];
  const a = Math.floor(Math.random()*9999);
  const b = Math.floor(Math.random()*999);
  const op = ops[Math.floor(Math.random()*ops.length)];
  return `${a} ${op} ${b} = ${eval(a+op.replace('^','**')+b) || (a+b)}`;
}
function randomIp(){
  return Array.from({length:4},()=>Math.floor(Math.random()*255)).join('.');
}

function buildTickerString(){
  const parts = [];
  for(let i=0;i<14;i++){
    const r = Math.random();
    if(r < 0.3) parts.push(enWords[Math.floor(Math.random()*enWords.length)]);
    else if(r < 0.55) parts.push(euWords[Math.floor(Math.random()*euWords.length)]);
    else if(r < 0.75) parts.push(randomHex(8));
    else if(r < 0.9) parts.push(randomCalc());
    else parts.push('IP::'+randomIp());
  }
  return parts.join('   //   ');
}

function refreshTickers(){
  document.getElementById('tickerTop').textContent = buildTickerString() + '     ';
  document.getElementById('tickerBottom').textContent = buildTickerString() + '     ';
}
refreshTickers();
setInterval(refreshTickers, 45000);

/* =========================================================
   ASCII HEADER + CLOCK
========================================================= */
document.getElementById('asciiHeader').textContent =
`ooooooooooooo ooooooooooooo ooooooooooooo\n` +
`::  TERMINAL DE ACCESO :: NODO CENTRAL  ::\n` +
`ooooooooooooo ooooooooooooo ooooooooooooo`;

function tickClock(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('es-AR', {hour12:false});
}
tickClock();
setInterval(tickClock, 1000);

/* =========================================================
   RENDER
========================================================= */
function renderAll(){
  const tree = document.getElementById('tree');
  tree.innerHTML = '';
  const query = document.getElementById('search').value.trim().toLowerCase();

  let totalLinks = 0;

  if(state.categories.length === 0){
    tree.innerHTML = '<div class="empty-msg">directorio vacío. crea una categoría para empezar &gt;</div>';
  }

  state.categories.forEach(cat => {
    const filteredLinks = cat.links.filter(l => {
      if(!query) return true;
      const hay = (l.title + ' ' + l.url + ' ' + (l.desc||'') + ' ' + (l.tags||[]).join(' ') + ' ' + cat.name).toLowerCase();
      return hay.includes(query);
    });

    if(query && filteredLinks.length === 0) return;

    totalLinks += cat.links.length;

    const catDiv = document.createElement('div');
    catDiv.className = 'category' + (cat.open || query ? ' open' : '');

    const head = document.createElement('div');
    head.className = 'category-head';
    head.innerHTML = `
      <div class="category-name">${escapeHtml(cat.name)}<span class="category-count">[${cat.links.length}]</span></div>
      <div class="category-actions">
        <button class="mini-btn" title="renombrar" onclick="event.stopPropagation(); renameCategory('${cat.id}')">ren</button>
        <button class="mini-btn danger" title="eliminar" onclick="event.stopPropagation(); deleteCategory('${cat.id}')">del</button>
      </div>
    `;
    head.addEventListener('click', () => {
      cat.open = !cat.open;
      saveData();
      renderAll();
    });
    catDiv.appendChild(head);

    const linksList = document.createElement('div');
    linksList.className = 'links-list';

    if(filteredLinks.length === 0){
      linksList.innerHTML = '<div class="empty-msg">sin links en este directorio &gt;</div>';
    }

    filteredLinks.forEach(link => {
      const row = document.createElement('div');
      row.className = 'link-row';
      row.innerHTML = `
        <div class="link-main">
          <a class="link-title" href="${escapeAttr(link.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(link.title)}</a>
          <div class="link-meta">${escapeHtml(link.url)}${link.desc ? ' — ' + escapeHtml(link.desc) : ''}</div>
          ${link.tags && link.tags.length ? `<div class="link-tags">#${link.tags.map(escapeHtml).join(' #')}</div>` : ''}
        </div>
        <div class="link-actions">
          <button class="mini-btn" onclick="editLink('${cat.id}','${link.id}')">edit</button>
          <button class="mini-btn danger" onclick="deleteLink('${cat.id}','${link.id}')">del</button>
        </div>
      `;
      linksList.appendChild(row);
    });

    catDiv.appendChild(linksList);
    tree.appendChild(catDiv);
  });

  document.getElementById('nodeCount').textContent = totalLinks;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

document.getElementById('search').addEventListener('input', renderAll);

/* =========================================================
   CATEGORY MODAL
========================================================= */
let editingCategoryId = null;

function openCategoryModal(){
  editingCategoryId = null;
  document.getElementById('categoryModalTitle').textContent = 'nueva_categoria';
  document.getElementById('categoryNameInput').value = '';
  document.getElementById('categoryModalOverlay').classList.add('visible');
  setTimeout(()=>document.getElementById('categoryNameInput').focus(), 50);
}
function renameCategory(id){
  const cat = state.categories.find(c=>c.id===id);
  if(!cat) return;
  editingCategoryId = id;
  document.getElementById('categoryModalTitle').textContent = 'renombrar_categoria';
  document.getElementById('categoryNameInput').value = cat.name;
  document.getElementById('categoryModalOverlay').classList.add('visible');
  setTimeout(()=>document.getElementById('categoryNameInput').focus(), 50);
}
function closeCategoryModal(){
  document.getElementById('categoryModalOverlay').classList.remove('visible');
}
function saveCategory(){
  const name = document.getElementById('categoryNameInput').value.trim();
  if(!name) return;
  if(editingCategoryId){
    const cat = state.categories.find(c=>c.id===editingCategoryId);
    if(cat) cat.name = name.toUpperCase();
  }else{
    state.categories.push({ id: cryptoId(), name: name.toUpperCase(), open:true, links:[] });
  }
  saveData();
  closeCategoryModal();
  renderAll();
  refreshCategorySelect();
}
function deleteCategory(id){
  const cat = state.categories.find(c=>c.id===id);
  if(!cat) return;
  if(!confirm(`eliminar categoría "${cat.name}" y sus ${cat.links.length} links?`)) return;
  state.categories = state.categories.filter(c=>c.id!==id);
  saveData();
  renderAll();
  refreshCategorySelect();
}

/* =========================================================
   LINK MODAL
========================================================= */
let editingLink = null; // {catId, linkId}

function refreshCategorySelect(){
  const sel = document.getElementById('linkCategorySelect');
  sel.innerHTML = state.categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
}

function openLinkModal(){
  if(state.categories.length === 0){
    alert('primero crea una categoría.');
    return;
  }
  editingLink = null;
  document.getElementById('linkModalTitle').textContent = 'nuevo_link';
  refreshCategorySelect();
  document.getElementById('linkTitleInput').value = '';
  document.getElementById('linkUrlInput').value = '';
  document.getElementById('linkTagsInput').value = '';
  document.getElementById('linkDescInput').value = '';
  document.getElementById('linkModalOverlay').classList.add('visible');
  setTimeout(()=>document.getElementById('linkTitleInput').focus(), 50);
}

function editLink(catId, linkId){
  const cat = state.categories.find(c=>c.id===catId);
  const link = cat && cat.links.find(l=>l.id===linkId);
  if(!link) return;
  editingLink = { catId, linkId };
  document.getElementById('linkModalTitle').textContent = 'editar_link';
  refreshCategorySelect();
  document.getElementById('linkCategorySelect').value = catId;
  document.getElementById('linkTitleInput').value = link.title;
  document.getElementById('linkUrlInput').value = link.url;
  document.getElementById('linkTagsInput').value = (link.tags||[]).join(', ');
  document.getElementById('linkDescInput').value = link.desc || '';
  document.getElementById('linkModalOverlay').classList.add('visible');
}

function closeLinkModal(){
  document.getElementById('linkModalOverlay').classList.remove('visible');
}

function saveLink(){
  const title = document.getElementById('linkTitleInput').value.trim();
  let url = document.getElementById('linkUrlInput').value.trim();
  const tags = document.getElementById('linkTagsInput').value.split(',').map(t=>t.trim()).filter(Boolean);
  const desc = document.getElementById('linkDescInput').value.trim();
  const catId = document.getElementById('linkCategorySelect').value;

  if(!title || !url){ alert('título y url son obligatorios.'); return; }
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;

  if(editingLink){
    // remove from old category if moved
    const oldCat = state.categories.find(c=>c.id===editingLink.catId);
    const linkObj = oldCat.links.find(l=>l.id===editingLink.linkId);
    linkObj.title = title; linkObj.url = url; linkObj.tags = tags; linkObj.desc = desc;
    if(editingLink.catId !== catId){
      oldCat.links = oldCat.links.filter(l=>l.id!==editingLink.linkId);
      const newCat = state.categories.find(c=>c.id===catId);
      newCat.links.push(linkObj);
    }
  }else{
    const cat = state.categories.find(c=>c.id===catId);
    cat.links.push({ id: cryptoId(), title, url, tags, desc });
    cat.open = true;
  }
  saveData();
  closeLinkModal();
  renderAll();
}

function deleteLink(catId, linkId){
  const cat = state.categories.find(c=>c.id===catId);
  if(!cat) return;
  if(!confirm('eliminar este link?')) return;
  cat.links = cat.links.filter(l=>l.id!==linkId);
  saveData();
  renderAll();
}

/* =========================================================
   EXPORT / IMPORT / RESET
========================================================= */
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `portal-hacker-links_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.categories || !Array.isArray(parsed.categories)) throw new Error('formato inválido');
      const mode = confirm('OK = combinar con datos actuales.\nCancelar = reemplazar todo.');
      if(mode){
        parsed.categories.forEach(importedCat => {
          const existing = state.categories.find(c => c.name === importedCat.name);
          if(existing){
            importedCat.links.forEach(l => {
              if(!existing.links.some(el => el.url === l.url)) existing.links.push({...l, id: cryptoId()});
            });
          }else{
            state.categories.push({...importedCat, id: cryptoId(), links: importedCat.links.map(l=>({...l, id: cryptoId()}))});
          }
        });
      }else{
        state = parsed;
      }
      saveData();
      renderAll();
      refreshCategorySelect();
      alert('importación completa.');
    }catch(err){
      alert('error al importar: archivo JSON inválido.');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function confirmReset(){
  if(!confirm('esto borrará TODOS los datos guardados. continuar?')) return;
  state = defaultData();
  saveData();
  renderAll();
  refreshCategorySelect();
}

/* =========================================================
   LOGIN GATE
========================================================= */
const ACCESS_CODE = 'ies21';

function initLogin(){
  const loginInput = document.getElementById('loginInput');
  const loginBox = document.getElementById('login-box');
  const loginError = document.getElementById('loginError');

  loginInput.focus();
  document.getElementById('login').addEventListener('click', () => loginInput.focus());

  loginInput.addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      const value = loginInput.value.trim().toLowerCase();
      if(value === ACCESS_CODE){
        loginError.textContent = '';
        document.getElementById('login').style.transition = 'opacity .4s';
        document.getElementById('login').style.opacity = 0;
        setTimeout(()=>{
          document.getElementById('login').style.display = 'none';
          runBoot();
        }, 400);
      }else{
        loginError.textContent = 'ACCESO DENEGADO — clave incorrecta.';
        loginInput.value = '';
        loginBox.classList.remove('shake');
        void loginBox.offsetWidth;
        loginBox.classList.add('shake');
      }
    }
  });
}

/* =========================================================
   INIT
========================================================= */
refreshCategorySelect();
initLogin();

// close modals on overlay click
document.getElementById('categoryModalOverlay').addEventListener('click', e => {
  if(e.target.id === 'categoryModalOverlay') closeCategoryModal();
});
document.getElementById('linkModalOverlay').addEventListener('click', e => {
  if(e.target.id === 'linkModalOverlay') closeLinkModal();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeCategoryModal(); closeLinkModal(); }
});
</script>
