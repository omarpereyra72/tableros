pposite of Soft Duro es lo opuesto de Blando Before is the opposite of After Antes es lo opuesto de Después"}]},{"id":"9-8","kind":"vocab","title":"Opuestos: práctica","items":[{"es":"Duro","en":"Hard","p":"jáaRd","ipa":"hɑɹd"},{"es":"Blando","en":"Soft","p":"sóft","ipa":"sɑft"},{"es":"Antes","en":"Before","p":"bifóoR","ipa":"bɪˈfɔɹ"},{"es":"Después","en":"After","p":"áafter","ipa":"ˈæftɚ"}],"note":""},{"id":"9-9","kind":"learn","title":"LA INTERROGACION CON WILL, WOULD, MAY y MIGHT","blocks":[{"t":"p","x":"Cuando se desea interrogar con tiempos de verbos que exigen el uso de will, would, may o might, basta alterar el orden, colocando la palabra will, would, may o might delante del pronombre personal."},{"t":"p","x":"Preg.- ¿Cómo se forma el interrogativo cuando se habla en los tiempos que exige el uso de will, would, may o might?"},{"t":"p","x":"Resp.- Colocando will, would, may o might al principio de la frase."},{"t":"p","x":"Es muy importante que el estudiante se familiarice con las formas verbales de esta p gina y las siguientes, las cuales son de continuo uso en la lengua inglesa."},{"t":"pre","x":"I will get   Yo conseguiré\nWill I get   ¿Conseguiré yo?\nWe will give   Nosotros daremos\nWill we give?   ¿Daremos nosotros?\nI will see   Yo veré\nWill I see?   ¿Veré yo?\nThey will send   Ellos enviarán\nWill they send?   ¿Enviarán ellos?\nYou will make   Usted hará\nWill you make?   ¿Hará usted?\nHe will keep   El mantendrá\nWill he keep?   ¿Mantendrá él?\nYou will say   Usted dirá\nWill you say?   ¿Dirá usted?\nWould he come?   ¿Vendría él?\nThey will come   Ellos vendrán\nWill they come?   ¿Vendrán ellos?\nThey would say   Ellos dirían\nWould they say?   ¿Dirían ellos?\nHe would come   El vendría\nWould he come?   ¿Vendría él?\nThey would let   Ellos dejarían\nWould they let?   ¿Dejarían ellos?\nYou would give   Usted daría\nWould you give?   ¿Daría usted?\nThey would see   Ellos verían\nWould they see?   ¿Verían ellos?\nHe would make   El haría\nWould he make?   ¿Haría él?\nShe may send   Ella puede enviar\nMay she send?   ¿Puede ella enviar?\nI would send   Yo enviaría\nWould I send?   ¿Enviaría yo?\nThey may see   Ellos pueden ver\nMay they see?   ¿Pueden ellos ver?\nWould they say?   ¿Dirían ellos?\nYou may give   Usted puede dar\nMay you give?   ¿Puede usted dar?\nI may get   Yo puedo conseguir\nMay I get?   ¿Puedo conseguir?\nWe may come   Nosotros podemos venir\nMay we come?   ¿Podemos venir?\nThey may take   Ellos pueden tomar\nMay they take?   ¿Pueden ellos tomar?\nYou may put   Usted puede poner\nMay you put?   ¿Puede usted poner?\nI may say   Yo puedo decir\nMay I say?   ¿Puedo yo decir?\nYou may keep   Usted puede mantener\nMay you keep?   ¿Puede usted mantener?\nHe might go   El podria ir\nMight he go?   ¿Podría él ir?\nThey might give   Ellos podrían dar\nMight they give?   ¿Podrían ellos dar?\nMight I see   ¿Podría yo ver?"}]},{"id":"9-10","kind":"phrases","title":"LA INTERROGACION CON WILL, WOULD, MAY y MIGHT: práctica","items":[{"es":"Yo conseguiré","en":"I will get","ipa":"aɪ wɪl ɡɛt"},{"es":"¿Conseguiré yo?","en":"Will I get","ipa":"wɪl aɪ ɡɛt"},{"es":"Nosotros daremos","en":"We will give","ipa":"wi wɪl ɡɪv"},{"es":"¿Daremos nosotros?","en":"Will we give?","ipa":"wɪl wi ɡɪv"},{"es":"Yo veré","en":"I will see","ipa":"aɪ wɪl si"},{"es":"¿Veré yo?","en":"Will I see?","ipa":"wɪl aɪ si"},{"es":"Ellos enviarán","en":"They will send","ipa":"ðeɪ wɪl sɛnd"},{"es":"¿Enviarán ellos?","en":"Will they send?","ipa":"wɪl ðeɪ sɛnd"},{"es":"¿Hará usted?","en":"Will you make?","ipa":"wɪl ju meɪk"},{"es":"El mantendrá","en":"He will keep","ipa":"hi wɪl kip"},{"es":"¿Mantendrá él?","en":"Will he keep?","ipa":"wɪl hi kip"},{"es":"¿Dirá usted?","en":"Will you say?","ipa":"wɪl ju seɪ"},{"es":"¿Vendría él?","en":"Would he come?","ipa":"wʊd hi kʌm"},{"es":"Ellos vendrán","en":"They will come","ipa":"ðeɪ wɪl kʌm"},{"es":"¿Vendrán ellos?","en":"Will they come?","ipa":"wɪl ðeɪ kʌm"},{"es":"Ellos dirían","en":"They would say","ipa":"ðeɪ wʊd seɪ"},{"es":"¿Dirían ellos?","en":"Would they say?","ipa":"wʊd ðeɪ seɪ"},{"es":"El vendría","en":"He would come","ipa":"hi wʊd kʌm"},{"es":"Ellos dejarían","en":"They would let","ipa":"ðeɪ wʊd lɛt"},{"es":"¿Dejarían ellos?","en":"Would they let?","ipa":"wʊd ðeɪ lɛt"},{"es":"¿Daría usted?","en":"Would you give?","ipa":"wʊd ju ɡɪv"},{"es":"Ellos verían","en":"They would see","ipa":"ðeɪ wʊd si"},{"es":"¿Verían ellos?","en":"Would they see?","ipa":"wʊd ðeɪ si"},{"es":"El haría","en":"He would make","ipa":"hi wʊd meɪk"},{"es":"¿Haría él?","en":"Would he make?","ipa":"wʊd hi meɪk"},{"es":"Ella puede enviar","en":"She may send","ipa":"ʃi meɪ sɛnd"},{"es":"¿Puede ella enviar?","en":"May she send?","ipa":"meɪ ʃi sɛnd"},{"es":"Yo enviaría","en":"I would send","ipa":"aɪ wʊd sɛnd"},{"es":"¿Enviaría yo?","en":"Would I send?","ipa":"wʊd aɪ sɛnd"},{"es":"Ellos pueden ver","en":"They may see","ipa":"ðeɪ meɪ si"},{"es":"¿Pueden ellos ver?","en":"May they see?","ipa":"meɪ ðeɪ si"},{"es":"¿Puede usted dar?","en":"May you give?","ipa":"meɪ ju ɡɪv"},{"es":"Yo puedo conseguir","en":"I may get","ipa":"aɪ meɪ ɡɛt"},{"es":"¿Puedo conseguir?","en":"May I get?","ipa":"meɪ aɪ ɡɛt"},{"es":"Nosotros podemos venir","en":"We may come","ipa":"wi meɪ kʌm"},{"es":"¿Podemos venir?","en":"May we come?","ipa":"meɪ wi kʌm"},{"es":"Ellos pueden tomar","en":"They may take","ipa":"ðeɪ meɪ teɪk"},{"es":"¿Pueden ellos tomar?","en":"May they take?","ipa":"meɪ ðeɪ teɪk"},{"es":"¿Puede usted poner?","en":"May you put?","ipa":"meɪ ju pʊt"},{"es":"Yo puedo decir","en":"I may say","ipa":"aɪ meɪ seɪ"},{"es":"¿Puedo yo decir?","en":"May I say?","ipa":"meɪ aɪ seɪ"},{"es":"¿Puede usted mantener?","en":"May you keep?","ipa":"meɪ ju kip"},{"es":"El podria ir","en":"He might go","ipa":"hi maɪt ɡoʊ"},{"es":"¿Podría él ir?","en":"Might he go?","ipa":"maɪt hi ɡoʊ"},{"es":"Ellos podrían dar","en":"They might give","ipa":"ðeɪ maɪt ɡɪv"},{"es":"¿Podrían ellos dar?","en":"Might they give?","ipa":"maɪt ðeɪ ɡɪv"},{"es":"¿Podría yo ver?","en":"Might I see","ipa":"maɪt aɪ si"}],"note":""},{"id":"9-11","kind":"learn","title":"La interrogacion hecha con To Be y To Have","blocks":[{"t":"p","x":"Ya sabemos que para formar el interrogativo de los verbos basta ante ponerles las palabras do, does o did; pero esto no se hace con to be y to have, los cuales forman su interrogativo sencillamente colocando primero el verbo seguido del pronombre."},{"t":"pre","x":"Esto es fácil entenderlo,   para   lo   cual   basta   fijarse   en   los"},{"t":"p","x":"siguientes ejemplos:"},{"t":"pre","x":"He is wrong   El está equivocado\nIs he wrong?   ¿Está él equivocado?\nThey are ready   Ellos están preparados\nAre they ready?   ¿Están ellos preparados?\nHe has done his work   El ha hecho su trabajo\nHas he done his work?   ¿Ha hecho él su trabajo?\nThey are in the house   Ellos están en la casa?\nAre they in the house?   ¿Están ellos en la casa?\nShe has been ill   Ella ha estado enferma\nHas she been ill?   ¿Ha estado ella enferma?\nHe was in the garden   El estaba en el jardín\nWas he in the garden?   ¿Estaba él en el jardín?\nHe was writing a letter   El estaba escribiendo una carta\nWas he writing a letter?   ¿Estaba él escribiendo una carta?\nThey have money in this bank   Ellos tienen dinero en este banco\nHave they money in that bank?   ¿Tienen ellos dinero en este banco?\nHe has gone with his mother   El ha ido con su madre\nHas he gone with his mother?   ¿Ha ido él con su madre?"}]},{"id":"9-12","kind":"phrases","title":"La interrogacion hecha con To Be y To Have: práctica","items":[{"es":"El está equivocado","en":"He is wrong","ipa":"hi ɪz ɹɔŋ"},{"es":"¿Está él equivocado?","en":"Is he wrong?","ipa":"ɪz hi ɹɔŋ"},{"es":"Ellos están preparados","en":"They are ready","ipa":"ðeɪ ɑɹ ˈɹɛdi"},{"es":"¿Están ellos preparados?","en":"Are they ready?","ipa":"ɑɹ ðeɪ ˈɹɛdi"},{"es":"El ha hecho su trabajo","en":"He has done his work"},{"es":"¿Ha hecho él su trabajo?","en":"Has he done his work?"},{"es":"Ellos están en la casa?","en":"They are in the house"},{"es":"¿Están ellos en la casa?","en":"Are they in the house?"},{"es":"Ella ha estado enferma","en":"She has been ill"},{"es":"¿Ha estado ella enferma?","en":"Has she been ill?"},{"es":"El estaba en el jardín","en":"He was in the garden"},{"es":"¿Estaba él en el jardín?","en":"Was he in the garden?"},{"es":"El estaba escribiendo una carta","en":"He was writing a letter"},{"es":"¿Estaba él escribiendo una carta?","en":"Was he writing a letter?"},{"es":"Ellos tienen dinero en este banco","en":"They have money in this bank"},{"es":"¿Tienen ellos dinero en este banco?","en":"Have they money in that bank?"},{"es":"El ha ido con su madre","en":"He has gone with his mother"},{"es":"¿Ha ido él con su madre?","en":"Has he gone with his mother?"}],"note":""},{"id":"9-13","kind":"learn","title":"Presente compuesto interrogativo","blocks":[{"t":"p","x":"Usted ya sabe cómo se interroga con do en tiempo presente. Ahora bien, para interrogar en tiempo presente compuesto (forma que es mucho más usada), se coloca simplemente el pronombre entre el presente del verbo to be y algún gerundio."},{"t":"pre","x":"He is going   El está yendo\nIs he going?   ¿Está él yendo?\nThey are sending   Ellos están enviando\nAre they sending?   ¿Están ellos enviando?"},{"t":"p","x":"Preg.-¿Cuáles son las dos formas de interrogar en tiempo presente?"},{"t":"p","x":"Resp.- Por medio de do o combinando el presente de to be con algún gerundio."},{"t":"p","x":"Formar la interrogación con to be en combinación con cualquier verbo en gerundio es muy fácil, como podrá usted comprobarlo familiarizándose con las formas verbales siguientes:"},{"t":"pre","x":"He is seeing   El está viendo\nIs he seeing?   ¿Está él viendo?\nHe is getting   El está consiguiendo\nIs he getting?   ¿Está él consiguiendo?\nThey are sending   Ellos están enviando\nAre they sending?   ¿Están ellos enviando?\nYou are keeping   Usted está manteniendo\nAre you keeping?   ¿Está usted manteniendo?\nHe is making   El está haciendo\nIs he making?   ¿Está él haciendo?\nWe are going   Nosotros estamos yendo\nAre we going?   ¿Estamos nosotros yendo?\nThey are putting   Ellos están poniendo\nAre they putting?   ¿Están ellos poniendo?"}]},{"id":"9-14","kind":"phrases","title":"Presente compuesto interrogativo: práctica","items":[{"es":"El está yendo","en":"He is going","ipa":"hi ɪz ˈɡoʊɪŋ"},{"es":"¿Está él yendo?","en":"Is he going?","ipa":"ɪz hi ˈɡoʊɪŋ"},{"es":"Ellos están enviando","en":"They are sending","ipa":"ðeɪ ɑɹ ˈsɛndɪŋ"},{"es":"¿Están ellos enviando?","en":"Are they sending? gerundio."},{"es":"El está viendo","en":"He is seeing","ipa":"hi ɪz ˈsiɪŋ"},{"es":"¿Está él viendo?","en":"Is he seeing?","ipa":"ɪz hi ˈsiɪŋ"},{"es":"El está consiguiendo","en":"He is getting","ipa":"hi ɪz ˈɡɛtɪŋ"},{"es":"¿Está él consiguiendo?","en":"Is he getting?","ipa":"ɪz hi ˈɡɛtɪŋ"},{"es":"¿Están ellos enviando?","en":"Are they sending?","ipa":"ɑɹ ðeɪ ˈsɛndɪŋ"},{"es":"¿Está usted manteniendo?","en":"Are you keeping?","ipa":"ɑɹ ju ˈkipɪŋ"},{"es":"El está haciendo","en":"He is making","ipa":"hi ɪz ˈmeɪkɪŋ"},{"es":"¿Está él haciendo?","en":"Is he making?","ipa":"ɪz hi ˈmeɪkɪŋ"},{"es":"Nosotros estamos yendo","en":"We are going","ipa":"wi ɑɹ ˈɡoʊɪŋ"},{"es":"¿Estamos nosotros yendo?","en":"Are we going?","ipa":"ɑɹ wi ˈɡoʊɪŋ"},{"es":"Ellos están poniendo","en":"They are putting","ipa":"ðeɪ ɑɹ ˈpʌtɪŋ"},{"es":"¿Están ellos poniendo?","en":"Are they putting?","ipa":"ɑɹ ðeɪ ˈpʌtɪŋ"}],"note":""},{"id":"9-15","kind":"learn","title":"Palabras interrogativas","blocks":[{"t":"p","x":"Se puede interrogar en ingles, igual que en castellano, con ciertas palabras como: qué, dónde, cuándo, por qué, etc."},{"t":"p","x":"No necesitaremos dar mayores explicaciones sobre esto, porque esta forma de interrogar es igual en nuestro idioma castellano como en inglés."},{"t":"p","x":"Estudie con atención las explicaciones y las frases de esta página y las siguientes y le será sumamente sencillo interrogar con las palabras que, donde, cuándo, cómo, etc."}]},{"id":"9-16","kind":"learn","title":"Who","blocks":[{"t":"p","x":"WHO (júu) significa quién, quiénes."},{"t":"p","x":"El pronombre who se emplea refiriéndose a personas."},{"t":"pre","x":"Who is making that noise?   ¿Quién está haciendo ese ruido?\nWho said that?   ¿Quién dijo eso?\nWho are you?   ¿Quién es usted?\nWho is that man?   ¿Quién es ese hombre?\nWho are those men?   ¿Quienes son esos hombres?"}]},{"id":"9-17","kind":"phrases","title":"Who: práctica","items":[{"es":"¿Quién está haciendo ese ruido?","en":"Who is making that noise?"},{"es":"¿Quién dijo eso?","en":"Who said that?","ipa":"hu sɛd ðæt"},{"es":"¿Quién es usted?","en":"Who are you?","ipa":"hu ɑɹ ju"},{"es":"¿Quién es ese hombre?","en":"Who is that man?"},{"es":"¿Quienes son esos hombres?","en":"Who are those men?"}],"note":""},{"id":"9-18","kind":"learn","title":"Whom","blocks":[{"t":"p","x":"Who después de una preposición se convierte en Whom (júum)."},{"t":"pre","x":"With whom?   ¿Con quién?\nWith whom are you working?   ¿Con quién está usted trabajando?\nTo whom?   ¿A quién?\nTo whom are you writing?   ¿A quién está usted escribiendo?\nFor whom?   ¿Para quién?\nFor whom is that letter?   ¿Para quién es esa carta?"}]},{"id":"9-19","kind":"phrases","title":"Whom: práctica","items":[{"es":"¿Con quién?","en":"With whom?","ipa":"wɪð hum"},{"es":"¿Con quién está usted trabajando?","en":"With whom are you working?"},{"es":"¿A quién?","en":"To whom?","ipa":"tu hum"},{"es":"¿A quién está usted escribiendo?","en":"To whom are you writing?"},{"es":"¿Para quién?","en":"For whom?","ipa":"fɔɹ hum"},{"es":"¿Para quién es esa carta?","en":"For whom is that letter?"}],"note":""},{"id":"9-20","kind":"learn","title":"Which","blocks":[{"t":"p","x":"La palabra Which (juích) es de mucho uso y sus significados deben ser cuidadosamente estudiados."},{"t":"pre","x":"Which significa cuál,   cuáles,   lo   cual,   el   cual,   la   cual,   los"},{"t":"p","x":"cuales, las cuales."},{"t":"pre","x":"Which is your room?   ¿Cuál es su pieza?\nWhich is my plate?   ¿Cuál es mi plato?\nWhich is your brother?   ¿Cuál es su hermano?\nWhich is your book?   ¿Cuál es su libro?\nWhich is your house?   ¿Cuál es su casa?\nWhich are your books?   ¿Cuáles son sus libros?\nWhich is the road to Lima?   ¿Cuál es el camino a Lima?\nWhich are your shoes?   ¿Cuáles son sus zapatos?"}]},{"id":"9-21","kind":"phrases","title":"Which: práctica","items":[{"es":"¿Cuál es su pieza?","en":"Which is your room?"},{"es":"¿Cuál es mi plato?","en":"Which is my plate?"},{"es":"¿Cuál es su hermano?","en":"Which is your brother?"},{"es":"¿Cuál es su libro?","en":"Which is your book?"},{"es":"¿Cuál es su casa?","en":"Which is your house?"},{"es":"¿Cuáles son sus libros?","en":"Which are your books?"},{"es":"¿Cuál es el camino a Lima?","en":"Which is the road to Lima?"},{"es":"¿Cuáles son sus zapatos?","en":"Which are your shoes?"}],"note":""},{"id":"9-22","kind":"learn","title":"Where","blocks":[{"t":"p","x":"La palabra Where (juéar) significa dónde."},{"t":"pre","x":"Where is my coat?   ¿Dónde está mi chaqueta?\nWhere is my son?   ¿Dónde está mi hijo?\nWhere are you?   ¿Donde está usted?\nWhere is my hat?   ¿Dónde está mi sombrero?\nWhere is your house?   ¿Dónde está su casa?\nWhere is my money?   ¿Dónde está mi dinero?\nWhere is my mother?   ¿Dónde está mi madre?\nWhere is the sugar?   ¿Dónde está el azúcar?"}]},{"id":"9-23","kind":"phrases","title":"Where: práctica","items":[{"es":"¿Dónde está mi chaqueta?","en":"Where is my coat?"},{"es":"¿Dónde está mi hijo?","en":"Where is my son?"},{"es":"¿Donde está usted?","en":"Where are you?","ipa":"wɛɹ ɑɹ ju"},{"es":"¿Dónde está mi sombrero?","en":"Where is my hat?"},{"es":"¿Dónde está su casa?","en":"Where is your house?"},{"es":"¿Dónde está mi dinero?","en":"Where is my money?"},{"es":"¿Dónde está mi madre?","en":"Where is my mother?"},{"es":"¿Dónde está el azúcar?","en":"Where is the sugar?"}],"note":""},{"id":"9-24","kind":"learn","title":"When","blocks":[{"t":"p","x":"La palabra When (juén) significa cuándo."},{"t":"pre","x":"When did you go to Peru?   ¿Cuando fué usted a Perú?\nWhen may i go?   ¿Cuando puedo ir?\nWhen will you go to Panam ?   ¿Cuando irá usted a Quito?\nWhen will you go to Paris?   ¿Cuando irá usted a París?\nWhen he will come?   ¿Cuando vendrá él?"}]},{"id":"9-25","kind":"phrases","title":"When: práctica","items":[{"es":"¿Cuando fué usted a Perú?","en":"When did you go to Peru?"},{"es":"¿Cuando puedo ir?","en":"When may i go?"},{"es":"¿Cuando irá usted a Quito?","en":"When will you go to Panam ?"},{"es":"¿Cuando irá usted a París?","en":"When will you go to Paris?"},{"es":"¿Cuando vendrá él?","en":"When he will come?"}],"note":""},{"id":"9-26","kind":"learn","title":"What","blocks":[{"t":"p","x":"La palabra What (juót) significa qué."},{"t":"pre","x":"What are you doing?   ¿Qué está usted haciendo?\nWhat is that?   ¿Qué es eso?\nWhat are you saying?   ¿Qué está usted diciendo?\nWhat are you saying?   ¿Qué están ustedes diciendo?\nWhat did he say?   ¿Qué dijo él?\nWhat town is this?   ¿Qué ciudad es ésta?\nWhat country is this?   ¿Qué país es éste?\nIs that what you say?   ¿Es eso lo que usted dijo?\nIs that what you did?   ¿Es eso lo que usted hizo?\nWhat is the time?   ¿Qué hora es?"},{"t":"p","x":"En frases admirativas, what va seguido de a."},{"t":"pre","x":"What a small house!   Qué casa pequeña!\nWhat a good idea!   Qué buena idea!\nWhat a strong man!   Qué hombre fuerte!\nWhat a beautiful flower!   Qué hermosa flor!"}]},{"id":"9-27","kind":"phrases","title":"What: práctica","items":[{"es":"¿Qué está usted haciendo?","en":"What are you doing?"},{"es":"¿Qué es eso?","en":"What is that?","ipa":"wʌt ɪz ðæt"},{"es":"¿Qué está usted diciendo?","en":"What are you saying?"},{"es":"¿Qué dijo él?","en":"What did he say?"},{"es":"¿Qué ciudad es ésta?","en":"What town is this?"},{"es":"¿Qué país es éste?","en":"What country is this?"},{"es":"¿Es eso lo que usted dijo?  hay en singular, y there are cuando se habla en plural."},{"t":"p","x":"Preg.- ¿Cómo se traduce la expresión verbal castellana hay?"},{"t":"p","x":"Resp.- La expresión hay se traduce por there is o por there are."}]},{"id":"9-35","kind":"learn","title":"Ejemplos","blocks":[{"t":"pre","x":"There is bread on the table   Hay pan sobre la mesa\nThere is water in the bath   Hay agua en el baño\nThere are four boys here   Hay cuatro niños aquí\nThere is no work for me   No hay trabajo para mí\nThere is no food for him   No hay alimento para él\nThere are two letters for you   Hay dos cartas para usted\nThere is no water   No hay agua"}]},{"id":"9-36","kind":"phrases","title":"Ejemplos: práctica","items":[{"es":"Hay (singular)","en":"There is","p":"déAR iz","ipa":"ðɛɹ ɪz"},{"es":"Hay (plural)","en":"There are","p":"déAR aR","ipa":"ðɛɹ ɑɹ"},{"es":"Hay pan sobre la mesa","en":"There is bread on the table"},{"es":"Hay agua en el baño","en":"There is water in the bath"},{"es":"Hay cuatro niños aquí","en":"There are four boys here"},{"es":"No hay trabajo para mí","en":"There is no work for me"},{"es":"No hay alimento para él","en":"There is no food for him"},{"es":"Hay dos cartas para usted","en":"There are two letters for you"},{"es":"No hay agua","en":"There is no water"}],"note":""},{"id":"9-37","kind":"learn","title":"PARA INTEROGAR CON THERE IS o THERE ARE","blocks":[{"t":"p","x":"Para interrogar con there is o there are, se invierte el orden de estas palabras."},{"t":"pre","x":"Is there? (iz déAR)   ¿Hay? (singular)\nAre there? ( aR déAR)   ¿Hay) (plural)\nIs there a letter for me?   ¿Hay una carta para mí?\nAre there any apples in the house?   ¿Hay manzanas en la casa?\nAre there any books on the table?   ¿Hay libros sobre la mesa?\nIs there a boy here?   ¿Hay un niño aquí?"}]},{"id":"9-38","kind":"phrases","title":"PARA INTEROGAR CON THERE IS o THERE ARE: práctica","items":[{"es":"¿Hay una carta para mí?","en":"Is there a letter for me?"},{"es":"¿Hay manzanas en la casa?","en":"Are there any apples in the house?"},{"es":"¿Hay libros sobre la mesa?","en":"Are there any books on the table?"},{"es":"¿Hay un niño aquí?","en":"Is there a boy here?"}],"note":""},{"id":"9-39","kind":"learn","title":"THERE WAS y THERE WERE","blocks":[{"t":"p","x":"La expresión verbal impersonal había o hubo se traduce por there was cuando se habla en singular, y por there were cuando se habla en plural."},{"t":"pre","x":"Preg.-   ¿Cómo se traduce la expresión verbal impersonal"},{"t":"p","x":"castellana había o hubo?"},{"t":"p","x":"Resp.- Las expresiones había o hubo se traducen por there was o por there were."},{"t":"p","x":"Estudie cuidadosamente las siguientes frases:"},{"t":"pre","x":"There was (déAR uós)   Había o Hubo (singular)\nThere were (déAR uéeR)   Había o Hubo (plural)\nThere was a war in Asia   Hubo una guerra en Asia\nThere was a letter for you   Había una carta para usted\nThere was no news for you   No había noticias para Ud.\nThere was no sugar   No había azúcar\nThere were no boys here   No había niños aquí"}]},{"id":"9-40","kind":"phrases","title":"THERE WAS y THERE WERE: práctica","items":[{"es":"Había o Hubo (singular)","en":"There was","p":"déAR uós","ipa":"ðɛɹ wɑz"},{"es":"Había o Hubo (plural)","en":"There were","p":"déAR uéeR","ipa":"ðɛɹ wɝ"},{"es":"Hubo una guerra en Asia","en":"There was a war in Asia"},{"es":"Había una carta para usted","en":"There was a letter for you"},{"es":"No había noticias para Ud.","en":"There was no news for you"},{"es":"No había azúcar","en":"There was no sugar"},{"es":"No había niños aquí","en":"There were no boys here"}],"note":""},{"id":"9-41","kind":"learn","title":"PARA INTERROGAR CON THERE WAS o THERE WERE","blocks":[{"t":"pre","x":"Para interrogar con las expresiones there was o   ther   were"},{"t":"p","x":"sencillamente se invierte el orden de estas palabras."},{"t":"pre","x":"Was there? (uós déAR)   ¿Había?, ¿Hubo? (singular)\nWere there? (uéeR déAR)   ¿Había?, ¿Hubo? (plural)\nWas there a s":[{"id":"10-1","kind":"learn","title":"Introducción","blocks":[{"t":"p","x":"Si el estudiante construye sus frases inglesa empleando un verbo diferente para cada idea diferente, nunca logrará aprender a hablar un correcto inglés, ya que lo más seguro es que después de años de esfuerzo y fatigas le invada el desaliento y abandone el estudio del inglés, debido a que es un trabajo sumamente difícil aprender"},{"t":"pre","x":"este idioma si se comienza   por la tarea, casi imposible,   de"},{"t":"p","x":"aprender los miles y miles de verbos regulares e irregulares, con sus cambios de forma, usos e inflexiones."},{"t":"pre","x":"Seguramente no ignorará   que los verbos son la espina dorsal de"},{"t":"p","x":"todo idioma. Los miles que componen el idioma inglés, con sus irregularidades y sus cambios de forma, constituyen un obstáculo casi insalvable para el estudiante de la América española."},{"t":"p","x":"Aquí es donde se basa principalmente el fracaso rotundo del aprendizaje del inglés en nuestra América, puede verse fácilmente la diferencia que puede existir entre aprender cuatro mil verbos distintos con la sencilla tarea de aprender los dieciséis verbos básicos."},{"t":"p","x":"Indudablemente que no puede pretenderse escribir elocuentemente poesías, o elevada prosa, sin el concurso de esos 4 000 verbos, pero tenemos la certeza de que el estudiante no tendrá la pretensión de aprender inglés para escribir poesías en ese idioma."},{"t":"p","x":"Lo que necesita es un método que le permita poder conversar y escribir un perfecto inglés con la menor fatiga y en el más breve tiempo posible, y para eso nada mejor que construir sus frases en la forma básica, usando solamente los 16 verbos básicos y las combinaciones verbales que le vamos a enseñar."},{"t":"p","x":"Estas combinaciones verbales no sólo son perfectamente correctas, sino que son usadas, con preferencia, por los mismos ingleses."},{"t":"p","x":"Por ejemplo, si deseamos usar el verbo empujar, en lugar de aprender d"},{"es":"Mantenido","en":"Kept","p":"képt","ipa":"kɛpt"},{"es":"Ser o estar","en":"To Be","ipa":"tu bi"},{"es":"Sido o estado","en":"Been","ipa":"bɪn"}],"note":""},{"id":"10-24","kind":"learn","title":"El sistema verbal ingles","blocks":[{"t":"p","x":"La mayor dificultad que ofrecen todos los idiomas son sus verbos; sin embargo, el sistema verbal inglés es por excepción y afortunadamente, de una simplicidad única. Todo lo que se necesita saber para conjugar un verbo inglés es conocer su presente, pasado y participio pasado."},{"t":"p","x":"La mejor manera de estudiar estos tres tiempos es repetirlos varias veces; por ejemplo, para aprender estos tres tiempos del verbo to take, bastará repetir varias veces: take, took, taken."},{"t":"pre","x":"Cuando estas palabras se hayan   pegado a su oido, sabrá\ninmediatamente que take corresponde   al presente, took al pasado y"},{"t":"p","x":"taken al participio pasado."},{"t":"p","x":"Algunos verbos como let y put, son iguales en sus tres tiempos; otros como have, send, make, get, say y keep, tienen el pasado y el participio iguales. Esto facilita aun más su aprendizaje."},{"t":"p","x":"El estudiante ya ha estudiado los tres principales tiempos de los verbos básicos, pero conviene que los repita hasta que ellos se le peguen al oido."},{"t":"pre","x":"Presente   Pasado   Participio   Presente   Pasado   Participio\nGive   Gave   Given   Seem   Seemed   Seemed\nSend   Sent   Sent   Get   Got   Got\nTake   Took   Taken   Let   Let   Let\nMake   Made   Made   See   Saw   Seen\nDo   Did   Done   Say   Said   Said\nCome   Came   Come   Put   Put   Put\nGo   Went   Gone   Keep   Kept   Kept\nHave   Had   Had   Be   Was   Been"}]},{"id":"10-25","kind":"phrases","title":"El sistema verbal ingles: práctica","items":[{"es":"pegado a su oido, sabrá al presente, took al pasado y","en":"Cuando estas palabras se hayan inmediatamente que take corresponde taken al participio pasado. peguen al oido."},{"es":"Pasado         Participio             Presente          Pasado          Participio","en":"Presente"},{"es":"Gave           Given                  Seem              Seemed          Seemed","en":"Give","ipa":"ɡɪv"},{"es":"Sent           Sent                   Get               Got             Got","en":"Send","ipa":"sɛnd"},{"es":"Took           Taken                  Let               Let             Let","en":"Take","ipa":"teɪk"},{"es":"Made           Made                   See               Saw             Seen","en":"Make","ipa":"meɪk"},{"es":"Did            Done                   Say               Said            Said","en":"Do","ipa":"du"},{"es":"Came           Come                   Put               Put             Put","en":"Come","ipa":"kʌm"},{"es":"Went           Gone                   Keep              Kept            Kept","en":"Go","ipa":"ɡoʊ"},{"es":"Had            Had                    Be                Was             Been","en":"Have","ipa":"hæv"}],"note":""},{"id":"10-26","kind":"learn","title":"Verbos ingleses: participios","blocks":[{"t":"p","x":"Al estudiar le conviene mucho tener un conocimiento perfecto y aprender a usar el pasado participio de los verbos ingleses, porque sus usos son exactamente los mismos en inglés como en castellano, y por tanto, cuando el estudiante se encuentre en apuros sobre la mejor manera de formar alguna frase inglesa en tiempo pasado, puede salir en el paso poniendo la frase en pasado participio y así estará seguro de poder decir esa frase en perfecto inglés, sin dificultad alguna, ya que la formación de la frases en ese tiempo es igual en ambos idiomas."},{"t":"p","x":"En el estudio de un idioma extranjero, vale más una onza de práctica que una libra de teoria; por consiguiente, bastará que el estudiante se familiarice con las frases que van a continuación para comprender lo fácil que resulta en participio pasado, y lo fácil que resultara formar innumerables frases en ese tiempo verbal. Los participios pasados en esos ejemplos en letras cursivas."},{"t":"pre","x":"(Give – Gave – Given)   (guív – guéiv – guivn)\nTo give a reward   Dar un premio\nI give a reward   Yo doy un premio\nI have given a reward   Yo he dado un premio\nI had given a reward   Yo había dado un premio\n(send – sent – sent)   (send – sent – sent)\nTo send a letter   Enviar una carta\nHe sends a letter   El envía una carta\nHe has sent a letter   El ha enviado una carta\nHe had sent a letter   El había enviado una carta\n(take – took – taken)   (téik – tuk – teikn)\nTo take a book   Tomar un libro\nShe takes a book   Ella toma un libro\nShe has taken a book   Ella ha tomado un libro\nShe had taken a book   Ella había tomado un libro\n(make – made – made)   (méik – méid – meid)\nTo make a table   Hacer una mesa\nWe make a table   Hacemos una mesa\nWe have made a table   Hemos hecho una mesa\nWe had made a table   Habíamos hecho una mesa\n(do – did – done)   (duu – did – dan)\nTo do a work   Hacer un trabajo\nHe does his work   El hace su trabajo\nHe has done his werk   El ha hecho su trabajo\nHe had done his werk   El había hecho su trabajo\n(come – came – come)   (cám – kéim – cam)\nTo came at seven   Venir a las siete\nI come at seven   Vengo a las siete\nI have come at seven   He venido a las siete\nI had come at seven   Había venido a las siete\n(go – went – gone)   (góu – uént – gon)\nTo go to Perú   Ir a Perú\nI go to Perú   Yo voy a Perú\nI have gone to Perú   Yo he ido a Perú\nI had gone to Perú   Yo había ido a Perú\n(get – got – got)   (guét – got – got)\nTo get the money   Conseguiré el dinero\nI get the money   Consigo el dinero\nI have got the money   He conseguido el dinero\nI have got the money   Había conseguido\n(let – let –let)   (let – let – let)\nTo let him go   Déjalo ir (a el)\nI let him go   Yo lo dejo ir\nI have let him go   Yo lo he dejado ir\nI have let him go   Yo lo había dejado ir\n(see – saw – seen)   (síi – sóo – siin)\nI see the fight   Ver la pelea\nHe sees the fight   El ve la pelea\nHe has seen the fight   El ha visto la pelea\nHe had seen the fight   El había visto la pelea\n(say – said – said)   (séi – sed – sed)\nTo say that   Decir eso\nThey say that   Ellos dicen eso\nThey have said that   Ellos han dicho eso\nThey had said that   Ellos habían dicho eso\n(put – put – put)   (put – put – put)\nTo put   Poner"},{"t":"p","x":"She puts the food on the table Ella pone el alimento sobre la mesa She has put the food on table Ella ha puesto el alimento sobre la mesa"},{"t":"pre","x":"She had put the food on the   Ella había puesto el alimento\ntable   sobre la mesa\n(keep – kept – kept)   (kíip – kept – kept)\nTo keep her word   Mantener su palabra\nShe keeps her word   Ella mantiene su palabra\nShe has kept her word   Ha mantenido su palabra\nShe had kept her word   Había mantenido su palabra\n(be – was – been)   (bíi – uós – bíin)\nTo be ill   Estar enfermo\nWe are ill   Estamos enfermos\nWe have been ill   Hemos estado enfermo\nWe had been ill   Habíamos estado enfermo\n(have – had – had)   (jáv – jad – jad)\nTo have money   Tener dinero\nHe has money   El tiene dinero\nHe has had money   El ha tenido dinero\nHe had had money   El había tenido dinero"}]},{"id":"10-27","kind":"phrases","title":"Verbos ingleses: participios: práctica","items":[{"es":"Dar un premio","en":"To give a reward"},{"es":"Yo doy un premio","en":"I give a reward"},{"es":"Yo he dado un premio","en":"I have given a reward"},{"es":"Yo había dado un premio","en":"I had given a reward"},{"es":"Enviar una carta","en":"To send a letter"},{"es":"El envía una carta","en":"He sends a letter"},{"es":"El ha enviado una carta","en":"He has sent a letter"},{"es":"El había enviado una carta","en":"He had sent a letter"},{"es":"Tomar un libro","en":"To take a book"},{"es":"Ella toma un libro","en":"She takes a book"},{"es":"Ella ha tomado un libro","en":"She has taken a book"},{"es":"Ella había tomado un libro","en":"She had taken a book"},{"es":"Hacer una mesa","en":"To make a table"},{"es":"Hacemos una mesa","e <script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const KEY='ingles-basico-v1';
const DAY=86400000;
const defState=()=>({v:1,created:Date.now(),theme:'system',steps:{},srs:{},exams:{},xp:0,days:{},notes:[],links:null,lastExport:0,

let S=defState(),STORE_OK=true;
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);S=Object.assign(defState(),o);S.set=Object.assign(defState().set,o.set||{})}}catch(e){STORE_OK=false}}
let saveT=0;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){STORE_OK=false}},150)}
const dstr=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function addXP(n){if(!n)return;S.xp+=n;const d=dstr();S.days[d]=(S.days[d]||0)+n;save()}

const ITEMS={};
const ik=en=>String(en).toLowerCase().trim();
VOCAB.forEach(v=>{const k=ik(v.en);if(!ITEMS[k])ITEMS[k]=v});

const IPAW={};VOCAB.forEach(v=>{if(v.ipa)IPAW[v.k]=v.ipa});
function itemOf(k){if(ITEMS[k])return ITEMS[k];if(k.startsWith('n:')){const n=S.notes.find(x=>x.id===k.slice(2));if(n)return{en:n.en,es:n.es,k}}return null}
/* ---------- progress ---------- */
const stepSt=id=>(S.steps[id]||{}).s||'';
const stepProg=id=>stepSt(id)==='d'?1:stepSt(id)==='s'?.5:0;
function markStep(id,st,pct){const o=S.steps[id]||(S.steps[id]={});if(st==='s'&&o.s==='d')return;if(o.s!=='d'&&st==='d')addXP(10);o.s=st;if(pct!=null)o.best=Math.max(o.best||0,pct);o.t=Date.now();save()}
function lessonProg(l){return l.steps.reduce((a,s)=>a+stepProg(s.id),0)/l.steps.length}
function courseProg(){const t=LESSONS.reduce((a,l)=>a+l.steps.length,0);return LESSONS.reduce((a,l)=>a+l.steps.reduce((b,s)=>b+stepProg(s.id),0),0)/t}
function nextStep(){for(const l of LESSONS)for(const s of l.steps)if(stepSt(s.id)!=='d')return {l,s};return null}
/* ---------- SRS ---------- */
const INT=[0,1,2,4,8,16,32,64];
function srsRate(k,q){ // q 0 again,1 good,2 easy

 if(q===0){c.b=0;c.d=Date.now()+10*60000;c.x++}
 else{c.b=Math.min(7,c.b+(q===2?2:1));c.d=Date.now()+INT[c.b]*DAY;c.o++}
 save()}
const srsDue=()=>Object.keys(S.srs).filter(k=>S.srs[k].d<=Date.now()&&itemOf(k));
const mastered=()=>Object.keys(S.srs).filter(k=>S.srs[k].b>=4).length;
const learnedVocab=()=>VOCAB.filter(v=>S.srs[v.k]&&S.srs[v.k].b>=3).length;

const deacc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const CONTR=[["don't","do not"],["doesn't","does not"],["didn't","did not"],["isn't","is not"],["aren't","are not"],["wasn't","was not"],["weren't","were not"],["won't","will not"],["haven't","have not"],["hasn't","has not"],["hadn't","had not"],["wouldn't","would not"],["can't","cannot"],["i'm","i am"],["it's","it is"],["he's","he is"],["she's","she is"],["that's","that is"],["there's","there is"],["what's","what is"],["we're","we are"],["they're","they are"],["you're","you are"],["i'll","i will"],["we'll","we will"],["he'll","he will"],["she'll","she will"],["you'll","you will"],["they'll","they will"],["i've","i have"],["we've","we have"],["they've","they have"],["you've","you have"],["i'd","i would"],["let's","let us"]];
function nz(s,en){let t=deacc(String(s).toLowerCase()).replace(/\(.*?\)/g,' ').replace(/[’‘`´]/g,"'").replace(/[¿¡?!.,;:"“”]/g,' ').replace(/\s+/g,' ').trim();

function distract(it,pool,field){const seen=new Set([nz(it[field])]);const out=[];

 if(mode==='mix'){const w=it.en.split(/\s+/).length;mode=w<=3?rnd(['mc','mc','type','mc']):rnd(['build','type','dict','mc'])}

 const base={it,key:it.k||ik(it.en)};
 if(mode==='mc'){const dir=Math.random()<.5?'en2es':'es2en';const d=distract(it,pool,dir==='en2es'?'es':'en');
  const f=dir==='en2es'?'es':'en';const opts=shuffle([{t:short(it[f]),ok:true}].concat(d.map(x=>({t:short(x[f]),ok:false}))));
  return{...base,k:'mc',prompt:dir==='en2es'?it.en:it.es,speak:dir==='en2es'?it.en:null,sub:dir==='en2es'?'¿Qué significa?':'¿Cómo se dice en inglés?',opts}}
 if(mode==='type')return{...base,k:'type',prompt:it.es,sub:'Escríbelo en inglés',answers:variantsEn(it),lang:'en',show:it.en};
 if(mode==='dict')return{...base,k:'type',prompt:'🔊',speak:it.en,auto:1,sub:'Escribe lo que escuchas',answers:[it.en],lang:'en',show:it.en,dict:1};
 if(mode==='build'){const t=it.en.replace(/\s+/g,' ').trim().split(' ');return{...base,k:'build',prompt:it.es,sub:'Ordena las palabras',tokens:shuffle(t.map((w,i)=>({w,i}))),answers:[it.en],show:it.en}}
 if(mode==='card'){const rev=Math.random()<.4;return{...base,k:'card',front:rev?it.es:it.en,back:rev?it.en:it.es,rev}}
 return mkQ(it,'mc',pool)}

 for(const[k,v]of Object.entries(o.exams||{})){const c=S.exams[k];if(!c)S.exams[k]=v;else{c.best=Math.max(c.best,v.best);c.tries=Math.max(c.tries,v.tries);c.hist=(c.hist||[]).concat(v.hist||[])}}

 const st=o&&o.estado||o;if(!st||typeof st!=='object'||!('steps' in st||'srs' in st||'xp' in st)){toast('No parece una copia de Inglés Básico');return}
 if(mode==='replace'){S=Object.assign(defState(),st);S.set=Object.assign(defState().set,st.set||{})}else mergeState(st);
 save();applyTheme();toast('Progreso importado');render()}
function applyTheme(){if(S.theme==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=S.theme}
/* ---------- actions ---------- */
const ACT={
nav(a){const v=a.dataset.v;HIST.length=0;R={...R,v,a:null,tab:'study',reset:false};render();scrollTo(0,0)},
theme(){const dark=document.documentElement.dataset.theme==='dark'||(S.theme==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);S.theme=dark?'light':'dark';applyTheme();save();render()},
say(a){speak(a.dataset.t,a.dataset.slow?.55:null)},
lesson(a){go('lesson',+a.dataset.n,!!a.dataset.rep)},step(a){go('step',a.dataset.id,!!a.dataset.rep)},back(){back()},
tab(a){R.tab=a.dataset.m;render()},toggleHide(){R.hide=!R.hide;render()},rev(a){a.classList.toggle('rev')},
mark(a){markStep(a.dataset.id,'d');toast('Marcado como dominado');render()},
learnDone(a){markStep(a.dataset.id,'d');toast('¡Bien! +10 XP');const {l,i}=STEPS[a.dataset.id];const nx=l.steps[i+1];if(nx)go('step',nx.id,true);else render()},
startItems(a){startItems(a.dataset.id,a.dataset.m)},review(){startReview()},
mixed(a){startMixed(a.dataset.m,a.dataset.t)},drill(a){startDrill(a.dataset.g,a.dataset.id||null)},vfinal(){startVExam()},
hard(){const it=Object.keys(S.srs).filter(k=>S.srs[k].x>=2&&S.srs[k].b<3).map(itemOf).filter(Boolean);startQ({title:'Palabras difíciles',qs:shuffle(it).slice(0,15).map(i=>mkQ(i,'mix',it)),mode:'mix'})},
qclose(){closeQ()},qredo(){Q.redo()},
qpick(a){const q=Q.qs[Q.i];Q.pick=+a.dataset.i;qResult(q.opts[Q.pick].ok)},
qsubmit(){const q=Q.qs[Q.i],v=($('#qin')||{}).value||'';Q.val=v;const r=q.chk?q.chk(v):check(v,q.answers,q.lang==='en');qResult(!!r.ok,r.near)},
qskip(){Q.val='';qResult(false)},
qput(a){const q=Q.qs[Q.i];Q.ans.push(q.tokens.find(t=>t.i==a.dataset.i));qRender()},qunput(a){Q.ans.splice(+a.dataset.j,1);qRender()},
qbuild(){const q=Q.qs[Q.i];const u=Q.ans.map(t=>t.w).join(' ');qResult(nz(u,true)===nz(q.answers[0],true))},
qflip(){if(!Q.flip){Q.flip=true;qRender()}},
qrate(a){const q=Q.qs[Q.i],r=+a.dataset.q;if(q.key)srsRate(q.key,r);if(r>0)Q.score++;else Q.wrong.push(q);qNext()},
qnext(){qNext()},
qover(){if(Q.fb&&!Q.fb.ok){Q.fb={ok:true};Q.score++;const q=Q.qs[Q.i];Q.wrong=Q.wrong.filter(x=>x!==q);if(q.key)srsRate(q.key,1);qRender()}},
exGrade(a){exGrade(a.dataset.id)},exRetry(a){R.er[a.dataset.id]=null;render()},
exov(a){const r=R.er[a.dataset.id];r.ov[a.dataset.k]=a.checked;exScore(a.dataset.id,false);const y=scrollY;render();scrollTo(0,y)},
dletter(a){R.dl=R.dl===a.dataset.c?'':a.dataset.c;R.dn=60;render()},dmore(){R.dn+=100;$('#dlist').innerHTML=dictList()},
srsAdd(a){const k=a.dataset.k;if(!S.srs[k]){S.srs[k]={b:0,d:Date.now(),o:0,x:0};save();toast('Agregada al repaso')}$('#dlist').innerHTML=dictList()},
noteFrom(a){const it=itemOf(a.dataset.k);if(it&&!S.notes.some(n=>n.en===it.en)){S.notes.unshift({id:Date.now().toString(36),en:it.en,es:it.es,note:it.p?'('+it.p+')':'',at:Date.now()});save();toast('Guardada en tu libreta')}else toast('Ya está en tu libreta')},
labtab(a){R.lab=a.dataset.k;render()},
mic(a){const t=a.dataset.t;toast('Habla ahora…');listen((r,err)=>{if(!r){toast(err==='unsupported'?'Tu navegador no tiene reconocimiento de voz (prueba Chrome).':'No te escuché bien, inténtalo otra vez');return}
 const ok=r.some(x=>nz(x,true)===nz(t,true)||lev(nz(x,true),nz(t,true))<=1);toast(`Escuché: “${r[0]}” — ${ok?'¡bien!':'prueba de nuevo'}`)})},
noteEdit(a){R.edn=a.dataset.id;render();scrollTo(0,0)},noteCancel(){R.edn=null;render()},
noteDel(a){S.notes=S.notes.filter(n=>n.id!==a.dataset.id);delete S.srs['n:'+a.dataset.id];save();render()},
noteSrs(a){const k='n:'+a.dataset.id;if(!S.srs[k])S.srs[k]={b:0,d:Date.now(),o:0,x:0};save();render()},
linkEdit(a){R.edl=a.dataset.id;render();scrollTo(0,0)},linkCancel(){R.edl=null;render()},
linkDel(a){S.links=S.links.filter(l=>l.id!==a.dataset.id);save();render()},
linkUp(a){const i=+a.dataset.i,L=S.links;[L[i-1],L[i]]=[L[i],L[i-1]];save();render()},linkDown(a){const i=+a.dataset.i,L=S.links;[L[i+1],L[i]]=[L[i],L[i+1]];save();render()},
exp(){const j=exportJSON();const b=$('#expbox');b.hidden=false;b.value=j;b.style.minHeight='160px';try{const bl=new Blob([j],{type:'application/json'});const u=URL.createObjectURL(bl);const x=document.createElement('a');x.href=u;x.download='ingles-basico-progreso-'+dstr()+'.json';document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){}toast('Copia generada: si no se descargó, copia el texto')},
copyExp(){const j=exportJSON();const b=$('#expbox');b.hidden=false;b.value=j;b.style.minHeight='160px';const fb=()=>{b.select();toast('Selecciona y copia (Ctrl+C)')};try{navigator.clipboard.writeText(j).then(()=>toast('JSON copiado'),fb)}catch(e){fb()}},
imp(){const t=$('#impbox').value.trim();if(!t){toast('Pega el JSON o elige un archivo');return}doImport(t,$('#impmode').value)},
askReset(){R.reset=true;render()},noReset(){R.reset=false;render()},
doReset(){const th=S.theme;S=defState();S.theme=th;R.reset=false;save();applyTheme();toast('Progreso reiniciado');render()}};
function qNext(){Q.i++;Q.st='ask';Q.fb=null;Q.pick=null;Q.val='';Q.ans=[];Q.flip=false;Q.spoken=0;qRender()}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||a.tagName==='INPUT')return;const f=ACT[a.dataset.act];if(f){if(a.tagName==='A')return;f(a,e)}});
document.addEventListener('change',e=>{const a=e.target.closest('input[data-act]');if(a&&ACT[a.dataset.act])ACT[a.dataset.act](a,e);
 const t=e.target;if(t.id==='impfile'&&t.files[0]){const r=new FileReader();r.onload=()=>{$('#impbox').value=r.result;toast('Archivo cargado: pulsa Importar')};r.readAsText(t.files[0])}
 const d=t.dataset&&t.dataset.in;if(d==='df'){R.df=t.value;R.dn=60;$('#dlist').innerHTML=dictList()}
 if(d==='theme'){S.theme=t.value;applyTheme();save();render()}if(d==='voice'){S.set.voice=t.value;save()}
 if(d==='ipa'||d==='fig'){S.set[d]=t.checked;save()}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset&&t.dataset.in;if(!d)return;
 if(d==='dq'){R.dq=t.value;R.dn=60;$('#dlist').innerHTML=dictList()}
 else if(d==='nq'){R.nq=t.value;$('#nlist').innerHTML=notesList()}
 else if(d==='goal'){const n=parseInt(t.value,10);if(n>0){S.set.goal=n;save()}}
 else if(d==='rate'){S.set.rate=+t.value;save();t.parentNode.firstChild.textContent='Velocidad de voz: '+t.value}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=Object.fromEntries(new FormData(f));
 if(f.id==='nform'){const en=fd.en.trim(),es=fd.es.trim();if(!en||!es)return;if(R.edn){const n=S.notes.find(x=>x.id===R.edn);if(n)Object.assign(n,{en,es,note:fd.note.trim()});R.edn=null}else S.notes.unshift({id:Date.now().toString(36),en,es,note:fd.note.trim(),at:Date.now()});save();render()}
 if(f.id==='lform'){let u=fd.u.trim();if(!/^https?:\/\//i.test(u))u='https://'+u;try{new URL(u)}catch(x){toast('URL no válida');return}const L=linksArr();if(R.edl){const l=L.find(x=>x.id===R.edl);if(l)Object.assign(l,{t:fd.t.trim(),u,d:fd.d.trim()});R.edl=null}else L.push({id:Date.now().toString(36),t:fd.t.trim(),u,d:fd.d.trim()});save();render()}});
document.addEventListener('keydown',e=>{if(!Q)return;const q=Q.qs[Q.i];if(!q)return;
 if(e.key==='Enter'){e.preventDefault();if(q.k==='card'){if(!Q.flip)ACT.qflip();return}if(Q.st==='fb')qNext();else if(q.k==='type')ACT.qsubmit();else if(q.k==='build')ACT.qbuild()}
 else if(q.k==='mc'&&Q.st==='ask'&&/^[1-4]$/.test(e.key)){const i=+e.key-1;if(q.opts[i]){Q.pick=i;qResult(q.opts[i].ok)}}
 else if(q.k==='card'&&Q.flip&&/^[1-3]$/.test(e.key))ACT.qrate({dataset:{q:{1:0,2:1,3:2}[e.key]}})});
/* drag & drop links */
let dragI=null;
document.addEventListener('dragstart',e=>{const l=e.target.closest&&e.target.closest('.link');if(l){dragI=+l.dataset.i;l.classList.add('drag');try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','x')}catch(x){}}});
document.addEventListener('dragover',e=>{const l=e.target.closest&&e.target.closest('.link');if(l&&dragI!==null){e.preventDefault();$$('.link.over').forEach(x=>x.classList.remove('over'));l.classList.add('over')}});
document.addEventListener('drop',e=>{const l=e.target.closest&&e.target.closest('.link');if(l&&dragI!==null){e.preventDefault();const to=+l.dataset.i;const [m]=S.links.splice(dragI,1);S.links.splice(to,0,m);dragI=null;save();render()}});
document.addEventListener('dragend',()=>{dragI=null;$$('.link').forEach(x=>x.classList.remove('drag','over'))});
/* ---------- init ---------- */
load();applyTheme();if(!S.links){/* seeded lazily */}
render();


</script>
