<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark">
<title>Inglés Básico</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
:root{
--bg:#f5f6fb;--surface:#ffffff;--surface2:#eceef8;--fg:#14172b;--muted:#5a6182;--line:#e0e3f0;
--accent:#4f46e5;--accent-fg:#ffffff;--accent-soft:#e8e7fd;--accent2:#ff6b4a;
--good:#0f9d58;--good-soft:#d9f4e5;--bad:#d62b4b;--bad-soft:#fde2e8;--warn:#a96a00;--warn-soft:#fdf0d2;
--shadow:0 1px 2px rgba(20,23,43,.06),0 8px 24px rgba(20,23,43,.06);
--r:14px;--font:'Inter','Segoe UI',system-ui,-apple-system,'Noto Sans','DejaVu Sans',sans-serif;--head:'Plus Jakarta Sans','Inter','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0d0f1f;--surface:#161930;--surface2:#1f2342;--fg:#eceefc;--muted:#9aa2c9;--line:#2a2f55;
--accent:#9091ff;--accent-fg:#0d0f1f;--accent-soft:#25295a;--accent2:#ff8a6e;
--good:#46d68b;--good-soft:#11311f;--bad:#ff7a93;--bad-soft:#3b1722;--warn:#f1c46b;--warn-soft:#3a2e12;
--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0d0f1f;--surface:#161930;--surface2:#1f2342;--fg:#eceefc;--muted:#9aa2c9;--line:#2a2f55;
--accent:#9091ff;--accent-fg:#0d0f1f;--accent-soft:#25295a;--accent2:#ff8a6e;
--good:#46d68b;--good-soft:#11311f;--bad:#ff7a93;--bad-soft:#3b1722;--warn:#f1c46b;--warn-soft:#3a2e12;
--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--head);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,4vw,2.1rem);font-weight:800}h2{font-size:1.3rem;font-weight:700}h3{font-size:1.05rem;font-weight:700}
p{margin:0 0 .8em}a{color:var(--accent)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;font:800 1.1rem var(--head)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font:800 .95rem var(--head)}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:none;color:var(--muted);cursor:pointer;text-align:left;font-weight:600;width:100%}
.nav:hover{background:var(--surface2);color:var(--fg)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav svg{flex:none}
.grow{flex:1}
.main{padding:28px clamp(16px,4vw,40px) 90px;max-width:1040px;width:100%;margin:0 auto;min-width:0}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:.82rem;color:var(--muted)}
.chip b{color:var(--fg)}
.bottom{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:.84rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:650;min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.p:hover{filter:brightness(1.08)}
.btn.g{background:var(--good);color:#fff;border-color:var(--good)}
.btn.bad{color:var(--bad)}
.btn.s{padding:6px 11px;min-height:34px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.ib{width:36px;height:36px;padding:0;border-radius:50%;flex:none}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s}
.bar.good>i{background:var(--good)}
.hero{display:grid;gap:14px;background:linear-gradient(135deg,var(--accent),#7a5cff 60%,var(--accent2));color:#fff;border:0}
.hero .btn{background:#fff;color:#2a2380;border-color:#fff}
.hero .muted{color:rgba(255,255,255,.8)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:800 1.8rem var(--head);letter-spacing:-.02em}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none}
.ring i{font-style:normal;width:56px;height:56px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:800 .95rem var(--head)}
.lcard{cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left;transition:transform .15s,border-color .15s}
.lcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.num{font:800 .75rem var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.step:hover{border-color:var(--accent)}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:.7rem;font-weight:800;color:var(--muted)}
.dot.d{background:var(--good);border-color:var(--good);color:#fff}
.dot.s{border-color:var(--warn);color:var(--warn)}
.tag{font:700 .68rem var(--head);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.tag.ex{background:var(--warn-soft);color:var(--warn)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.tab{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:650;white-space:nowrap}
.tab.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.prose p,.prose li{max-width:68ch}
.prose b{color:var(--fg)}
.callout{padding:12px 14px;border-radius:12px;border-left:4px solid var(--accent);background:var(--accent-soft);margin:12px 0}
.callout.mod{border-color:var(--accent2);background:var(--warn-soft)}
.callout.mod::before{content:"Nota moderna";display:block;font:800 .7rem var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--accent2);margin-bottom:2px}
.tbl{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;min-width:260px;width:100%}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left}
th{font:700 .78rem var(--head);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
pre.book{font:.82rem/1.5 ui-monospace,'Cascadia Mono','DejaVu Sans Mono',monospace;background:var(--surface2);padding:12px;border-radius:10px;overflow-x:auto;margin:10px 0;white-space:pre}
.exrow{display:grid;grid-template-columns:minmax(120px,.5fr) 1fr;gap:6px 16px;padding:8px 0;border-bottom:1px dashed var(--line)}
.exrow b{font-weight:700}
@media(max-width:560px){.exrow{grid-template-columns:1fr}}
.w{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;padding:11px 4px;border-bottom:1px solid var(--line)}
.w .en{font-weight:700;font-size:1.05rem}
.w .es{color:var(--fg)}
.pron{font-family:var(--font);color:var(--accent);font-weight:600}
.pron .weak{font-size:.78em;opacity:.55;font-weight:500}
.ipa{font-family:'Noto Sans','Segoe UI','DejaVu Sans',sans-serif;color:var(--muted);font-size:.9rem}
.wex{grid-column:2;font-size:.86rem;color:var(--muted)}
.hide .es,.hide .wex{filter:blur(7px);cursor:pointer;user-select:none}
.hide .es.rev,.hide .wex.rev{filter:none}
input[type=text],input[type=search],input[type=url],textarea,select{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:110px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.86rem;color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:max(14px,env(safe-area-inset-top,0px)) 16px 40px}
.sheet .in{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:calc(100vh - 40px)}
.q{font:700 clamp(1.4rem,4vw,1.9rem) var(--head);text-align:center;margin:18px 0 6px;text-wrap:balance}
.qs{text-align:center;color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;font-weight:600}
.opt:hover{border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.fb{padding:14px;border-radius:12px}
.fb.ok{background:var(--good-soft);color:var(--fg);border:1px solid var(--good)}
.fb.no{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.near{background:var(--warn-soft);border:1px solid var(--warn)}
.bank,.ans{display:flex;gap:8px;flex-wrap:wrap;min-height:54px;padding:10px;border-radius:12px;border:2px dashed var(--line)}
.tok{padding:8px 13px;border-radius:9px;background:var(--surface);border:1px solid var(--line);cursor:pointer;font-weight:650;box-shadow:var(--shadow)}
.flip{perspective:900px;min-height:230px}
.face{min-height:230px;border-radius:18px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;cursor:pointer}
.big{font:800 clamp(1.7rem,6vw,2.4rem) var(--head)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;z-index:90;box-shadow:var(--shadow);max-width:90vw}
.bars{display:flex;gap:8px;align-items:flex-end;height:90px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%}
.bars i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:3px}
.bars span{font-size:.7rem;color:var(--muted)}
.exam .item{display:grid;grid-template-columns:2rem minmax(0,1fr) minmax(0,1.1fr);gap:8px 12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.exam .item.r1{background:linear-gradient(90deg,var(--good-soft),transparent)}
.exam .item.r0{background:linear-gradient(90deg,var(--bad-soft),transparent)}
.exam .corr{grid-column:2/-1;font-size:.86rem}
@media(max-width:600px){.exam .item{grid-template-columns:1.6rem 1fr}.exam .item input{grid-column:1/-1}.exam .corr{grid-column:1/-1}}
.link{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.link.drag{opacity:.4}
.link.over{border-color:var(--accent)}
.hl{background:var(--warn-soft);padding:0 3px;border-radius:3px}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.letter{padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:center}
.letter b{font:800 1.4rem var(--head);display:block}
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.pair{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface)}
.pair>div{flex:1;min-width:0}
@media(max-width:860px){
.app{grid-template-columns:minmax(0,1fr)}.side{display:none}
.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 2px;color:var(--muted);font-size:.68rem;font-weight:650;cursor:pointer}
.bottom button.on{color:var(--accent)}
.toast{bottom:84px}
}

</style>

d","p":"SHéided","ipa":"ˈʃeɪdɪd"},{"es":"Sonrisa","en":"Smile","p":"smail","ipa":"smaɪl"},{"es":"Sonreído","en":"Similed","p":"smailEd"},{"es":"Cambio","en":"Change","p":"chéinyE","ipa":"tʃeɪndʒ"},{"es":"Cambiado","en":"Changed","p":"chéinyEd","ipa":"tʃeɪndʒd"},{"es":"Puntapié","en":"Kick","p":"kík","ipa":"kɪk"},{"es":"Pateado","en":"Kicked","p":"kikEd","ipa":"kɪkt"},{"es":"Movimiento","en":"Move","p":"múuv","ipa":"muv"},{"es":"Movido","en":"Moved","p":"múuvEd","ipa":"muvd"},{"es":"Planta","en":"Plant","p":"plant","ipa":"plænt"},{"es":"Plantado","en":"Planted","p":"plantEd","ipa":"ˈplæntɪd"},{"es":"Uso","en":"Use","p":"iús","ipa":"jus"},{"es":"Usado","en":"Used","p":"iúsEd","ipa":"juzd"},{"es":"Paseo","en":"Walk","p":"uóok","ipa":"wɔk"},{"es":"Paseado","en":"Walked","p":"uóokEd","ipa":"wɔkt"},{"es":"Grito; llanto","en":"Cry","p":"crai","ipa":"kɹaɪ"},{"es":"Gritado; llorado","en":"Cried","p":"craid","ipa":"kɹaɪd"}],"note":""},{"id":"4-21","kind":"learn","title":"To Have","blocks":[{"t":"pre","x":"Para   evitarle   confusiones al estudiante, hasta ahora hemos"},{"t":"p","x":"enseñado el verbo to have como si significara solamente tener, pero como este importante verbo no sólo significa tener, sino también haber, vamos a estudiarlo ahora con sus dos significados."},{"t":"pre","x":"En el idioma inglés, el verbo   to have (haber o   tener) es el más"},{"t":"p","x":"importante de todos."},{"t":"pre","x":"Con to have se forma la   mayor parte de los   tiempos compuestos y"},{"t":"p","x":"tiene un continuo uso."},{"t":"pre","x":"No es posible pretender dominar la lengua inglesa   sin conjugar a"},{"t":"p","x":"la perfección el verbo to have."},{"t":"p","x":"To have tiene sólo tres palabras distintas: Have (jav), Has (jas) y Had (jad), en vez de las cien o más palabras castellanas que son indispensables para conjugar los verbos haber y tener."},{"t":"pre","x":"Aprender sólo tres palabras diferentes (has, have y   had) es muy\nfácil; la dificultad consiste en la parte castellana   del verbo y"},{"t":"p","x":"no en la inglesa."},{"t":"p","x":"El hecho de que para los dos verbos castellanos haber y tener"},{"t":"pre","x":"exista en   inglés sólo el   verbo to have,   suele producir\ndificultades   para los   estudiantes, dificultades   que serán"},{"t":"p","x":"fácilmente solucionadas si se estudia esta lección con más minuciosidad que las otras, porque si todas las lecciones deben dominarse perfectamente, ésta necesita dominarse aún mejor."},{"t":"p","x":"Recuerde que no está estudiando castellano, sino inglés; no se concentre en la conjugación española de haber o tener; concéntrese, con preferencia, en la parte inglesa, lo cual le hará mucho más rápido y fácil comprender el verbo to have."}]},{"id":"4-22","kind":"learn","title":"El presente de To Have","blocks":[{"t":"pre","x":"Repita en forma   calmosa y   en voz   alta, unas   cuantas veces, la"},{"t":"p","x":"siguiente frase: \"Siempre que necesite emplear el verbo haber o tener en tiempo presente usar‚ have, con todas las personas, menos con él o ella (he, she o it), con las debo usar has.\" Estudie cuidadosamente las frases siguientes:"},{"t":"pre","x":"He has some money   El tiene algún dinero\nI have changed my room   Yo he cambiado mi pieza\nHe has kicked the ball   El ha pateado la pelota\nShe has blue eyes   Ella tiene ojos azules\nYou have moved my table   Ud ha movido mi mesa\nHe has opened the door   El ha abierto la puerta\nI have news for you   Yo tengo noticias para ud\nI have planted a tree   Yo he plantado un árbol\nHe has a friend in Mexico   El tiene un amigo en México\nI have used this pen   Yo he usado esta pluma\nShe has a beautiful hair   Ella tiene un hermoso cabello\nWe have walked all the day   Nos. hemos caminado todo el día\nShe has two sons   Ella tiene dos hijos\nShe has a new hat   Ella tiene un sombrero nuevo"}]},{"id":"4-23","kind":"phrases","title":"El presente de To Have: práctica","items":[{"es":"calmosa y           en voz        alta, unas           cuantas veces, la","en":"Repita en forma siguiente frase:"},{"es":"Yo he o Yo tengo","en":"I have","p":"ai jáv","ipa":"aɪ hæv"},{"es":"El ha o El tiene","en":"He has","p":"jíi jas","ipa":"hi hæz"},{"es":"Ella ha o Ella tiene","en":"She has","p":"SHíi jás","ipa":"ʃi hæz"},{"es":"Ha o tiene (neutro)","en":"It has","p":"it jás","ipa":"ɪt hæz"},{"es":"Nosotros hemos o Nosotros tenemos","en":"We have","p":"uíjáv","ipa":"wi hæv"},{"es":"Ellos han o Ellos tienen","en":"They have","p":"dei jáv","ipa":"ðeɪ hæv"},{"es":"El tiene algún dinero","en":"He has some money"},{"es":"Yo he cambiado mi pieza","en":"I have changed my room"},{"es":"El ha pateado la pelota","en":"He has kicked the ball"},{"es":"Ella tiene ojos azules","en":"She has blue eyes"},{"es":"Ud ha movido mi mesa","en":"You have moved my table"},{"es":"El ha abierto la puerta","en":"He has opened the door"},{"es":"Yo tengo noticias para ud","en":"I have news for you"},{"es":"Yo he plantado un árbol","en":"I have planted a tree"},{"es":"El tiene un amigo en México","en":"He has a friend in Mexico"},{"es":"Yo he usado esta pluma","en":"I have used this pen"},{"es":"Ella tiene un hermoso cabello","en":"She has a beautiful hair"},{"es":"Nos. hemos caminado todo el día","en":"We have walked all the day"},{"es":"Ella tiene dos hijos","en":"She has two sons"},{"es":"Ella tiene un sombrero nuevo","en":"She has a new hat"}],"note":""},{"id":"4-24","kind":"learn","title":"El pasado de To Have","blocks":[{"t":"pre","x":"Para usar to have en tiempo pasado se   necesita recordar una sola"},{"t":"p","x":"palabra: Had (jad)."},{"t":"p","x":"Repita unas cuarenta veces la siguiente frase: \"Siempre que necesite usar el tiempo pasado de los verbos haber o tener, usar‚ la palabra had con la persona correspondiente.\" Al estudiar los verbos ingleses conviene recordar la casi invariabilidad de ellos; por ejemplo, al estudiar el pasado de to have no debe dejar de notarse que la palabra had es la única que se necesita recordar para conjugar el pasado de to have."},{"t":"p","x":"Estudie cuidadosamente las frases siguientes:"},{"t":"pre","x":"He had some money   El tenía algún dinero\nHe had kicked the ball   El había pateado la pelota\nI had walked all the day   Yo había caminado todo el día\nI had news for you   Yo tenía noticias para usted\nI had a friend in Uruguay   Yo tenía un amigo en Uruguay\nShe had two sons   Ella tenía dos hijos\nI had planted a tree   Yo había plantado un árbol"}]},{"id":"4-25","kind":"phrases","title":"El pasado de To Have: práctica","items":[{"es":"necesita recordar una sola","en":"Para usar to have en tiempo pasado se palabra: Had (jad)."},{"es":"Yo había, hube, tenía o tuve","en":"I had","p":"1","ipa":"aɪ hæd"},{"es":"El había, hubo, tenía o tuvo","en":"He had","ipa":"hi hæd"},{"es":"Había, hubo, tenía o tuvo (neutro)","en":"It had","ipa":"ɪt hæd"},{"es":"Nos. habíamos, hubimos, teníamos o tuvimos","en":"We had","ipa":"wi hæd"},{"es":"Ellos habían, hubieron, tenían o tuvieron","en":"They had","ipa":"ðeɪ hæd"},{"es":"El tenía algún dinero","en":"He had some money"},{"es":"El había pateado la pelota","en":"He had kicked the ball"},{"es":"Yo había caminado todo el día","en":"I had walked all the day"},{"es":"Yo tenía noticias para usted","en":"I had news for you"},{"es":"Yo tenía un amigo en Uruguay","en":"I had a friend in Uruguay"},{"es":"Ella tenía dos hijos","en":"She had two sons"},{"es":"Yo había plantado un árbol","en":"I had planted a tree"}],"note":""},{"id":"4-26","kind":"phrases","title":"El futuro de To Have","items":[{"es":"Yo habré o tendré","en":"I will have","ipa":"aɪ wɪl hæv"},{"es":"El habrá o tendrá","en":"He will have","ipa":"hi wɪl hæv"},{"es":"Ella habrá o tendrá","en":"She will have","ipa":"ʃi wɪl hæv"},{"es":"Habrá o tendrá (neutro)","en":"It will have","ipa":"ɪt wɪl hæv"},{"es":"Nosotros habremos o tendremos","en":"We will have","ipa":"wi wɪl hæv"},{"es":"Ellos habrán o tendrán","en":"They will have","ipa":"ðeɪ wɪl hæv"}],"note":""},{"id":"4-27  Be","blocks":[{"t":"pre","x":"Los dos verbos ingleses más   importantes son   to have   (haber o"},{"t":"p","x":"tener) y to be (ser o estar)."},{"t":"p","x":"Para evitarse confusiones, hasta ahora le hemos enseñado el verbo to be como si significara solamente estar, pero como este verbo significa también ser, vamos a estudiarlo ahora con sus dos significados."}]},{"id":"5-5","kind":"learn","title":"Tiempo presente de To Be","blocks":[{"t":"p","x":"Estudie cuidadosamente las frases siguientes:"},{"t":"pre","x":"She is angry   Ella está enojada\nThey are feeble   Ellas son débiles\nHe is very good   El es muy bueno\nI am happy   Yo soy feliz\nHe is very healthy   El es muy sano\nI am ill   Yo estoy enfermo\nShe is very kind   Ella es muy bondadosa\nHe is very old   El es muy viejo\nI am poor   Yo soy pobre\nThey are very sad   Ellos están muy tristes\nHe is very strong   El es muy fuerte\nShe is very young   Ella es muy joven\nHe is an able man   El es un hombre hábil\nThey are in the house   Ellos están en la casa\nHe is English   El es inglés"}]},{"id":"5-6","kind":"phrases","title":"Tiempo presente de To Be: práctica","items":[{"es":"Yo soy - Yo estoy","en":"I am","p":"ai am","ipa":"aɪ æm"},{"es":"El es - El está","en":"He is","p":"jíi is","ipa":"hi ɪz"},{"es":"Ella es - Ella está","en":"She is","p":"SHíi is","ipa":"ʃi ɪz"},{"es":"El (ella) es - El (ella) está (neutro)","en":"It is","p":"it is","ipa":"ɪt ɪz"},{"es":"Nosotros (as) somos o estamos","en":"We are","p":"uí aR","ipa":"wi ɑɹ"},{"es":"Ellos (ellas) son - Ellos (ellas) Están","en":"They are","p":"déi aR","ipa":"ðeɪ ɑɹ"},{"es":"Ella está enojada","en":"She is angry","ipa":"ʃi ɪz ˈæŋɡɹi"},{"es":"Ellas son débiles","en":"They are feeble","ipa":"ðeɪ ɑɹ ˈfibəl"},{"es":"El es muy bueno","en":"He is very good"},{"es":"Yo soy feliz","en":"I am happy","ipa":"aɪ æm ˈhæpi"},{"es":"El es muy sano","en":"He is very healthy"},{"es":"Yo estoy enfermo","en":"I am ill","ipa":"aɪ æm ɪl"},{"es":"Ella es muy bondadosa","en": o","en":"Solid","p":"sólid","ipa":"ˈsɑləd"},{"es":"Líquido","en":"Liquid","p":"lícuid","ipa":"ˈlɪkwəd"},{"es":"Limpio","en":"Clean","p":"clíin","ipa":"klin"},{"es":"Sucio","en":"Dirty","p":"déeRti","ipa":"ˈdɝti"},{"es":"Rápido","en":"Quick","p":"cuík","ipa":"kwɪk"},{"es":"Lento","en":"Slow","p":"slóU","ipa":"sloʊ"},{"es":"Apretado","en":"Tight","p":"táit","ipa":"taɪt"},{"es":"Suelto, ligero","en":"Loose","p":"luus","ipa":"lus"}],"note":""},{"id":"7-16","kind":"learn","title":"Palabras con lazos de union","blocks":[{"t":"p","x":"Es una ley mental ampliamente comprobada que las ideas de asociación mueren en la superficie del cerebro y por lo tanto se olvidan pronto. El secreto de un rápido aprendizaje en cualquier idioma está en la sociación de ideas."},{"t":"p","x":"En todos los idiomas existen palabras que tienen cierto lazo de unión entre ellas, lazos formados por la costumbre de ir casi siempre reunidas o por otra causa cualquiera, lo que hace mucho más fácil el aprenderlas en conjunto."},{"t":"p","x":"Estudie cuidadosamente todas las palabras con lazos de unión que van a continuación:"},{"t":"pre","x":"Public and Private   East and West   Father and Mother\n(páblic and práivEt)   (íist and uést)   (fáadeR ánd mádeR)\nPúblico y Privado   Este y Oeste   Padre y Madre\nWinter and Summer   North and South   Man and Woman\n(uínteR and sámeR)   (nóoRz ánd sáuz)   (mán ánd uúman)\nInvierno y Verano   Norte y Sur   Hombre y Mujer\nCheap and Dear   Brother and Sister   War and Peace\n(chíip and díaR)   (brádeR ánd sísteR)   (uóoR ánd píis)\nBarato y Caro   Hermano y Hermana   Guerra y Paz\nYou and I   Iron and Steel   Hammer and Neils\n(yúu ánd ái)   (áieRn ánd stíil)   (jámeR ánd néils)\nUsted y Yo   Hierro y Acero   Martillo y Clavos\nYoung and Old   He and She   First and Last\n(yáng ánd óUld)   (jíi ánd SHíi)   (féRst ánd last)\nJoven y Viejo   El y Ella   Primero y Ultimo\nHere and There   Boys and Girls   Doors and Windows\n(jíaR ánd déaR)   (bóis ánd guéRls)   (dóoRs ánd uíndoUs)\nAquí y Allá   Niños y Niñas   Puertas y Ventanas\nHat and Gloves   Good and Bad   Up and Down\n(ját ánd glávs)   (gúd ánd bád)   (áp ánd dáun)\nSombrero y Guantes   Bueno y Malo   Arriba y Abajo\nGold and Silver   Sun and Shade   Left and Right\n(góUld ánd sílveR)   (sán ánd SHéid)   (léft ánd ráit)\nOro y Plata   Sol y Sombra   Izquierda y Derecha\nLove and Hate   Clean and Dirty   This and That\n(láv ánd jéit)   (clíin ánd déeRti)   (dís ánd dát)\nAmor y Odio   Limpio y Sucio   Este y Aquel"},{"t":"p","x":"Hand and Foot (jánd ánd fút) Mano y pie"}]},{"id":"7-17","kind":"phrases","title":"Palabras con lazos de union: práctica","items":[{"es":"East and West                           Father and Mother","en":"Public and Private","ipa":"ˈpʌblɪk ənd ˈpɹaɪvət"},{"es":"North and South                         Man and Woman","en":"Winter and Summer","ipa":"ˈwɪntɚ ənd ˈsʌmɚ"},{"es":"Norte y Sur                             Hombre y Mujer","en":"Invierno y Verano"},{"es":"Brother and Sister                      War and Peace","en":"Cheap and Dear","ipa":"tʃip ənd dɪɹ"},{"es":"Hermano y Hermana                       Guerra y Paz","en":"Barato y Caro"},{"es":"Iron and Steel                          Hammer and Neils","en":"You and I","ipa":"ju ənd aɪ"},{"es":"Hierro y Acero                          Martillo y Clavos","en":"Usted y Yo"},{"es":"He and She                              First and Last","en":"Young and Old","ipa":"jʌŋ ənd oʊld"},{"es":"El y Ella                               Primero y Ultimo","en":"Joven y Viejo"},{"es":"Boys and Girls                         Doors and Windows","en":"Here and There","ipa":"hiɹ ənd ðɛɹ"},{"es":"Good and Bad                            Up and Down","en":"Hat and Gloves","ipa":"hæt ənd ɡlʌvz"},{"es":"Bueno y Malo                            Arriba y Abajo","en":"Sombrero y Guantes"},{"es":"Sun and Shade                           Left and Right","en":"Gold and Silver","ipa":"ɡoʊld ənd ˈsɪlvɚ"},{"es":"Sol y Sombra                           Izquierda y Derecha","en":"Oro y Plata","ipa":"ˈɔɹoʊ waɪ ˈplɑtə"},{"es":"Clean and Dirty                         This and That","en":"Love and Hate","ipa":"lʌv ənd heɪt"},{"es":"Limpio y Sucio                          Este y Aquel","en":"Amor y Odio"}],"note":""},{"id":"7-18","kind":"learn","title":"Some y any","blocks":[{"t":"p","x":"SOME (sám) = Algún, alguno, alguna, algo de ANY (éni) = Algún, alguno, alguna, algo de"},{"t":"pre","x":"En inglés se usa mucho some y any y su correcto uso se   va\nadquiriendo a poco a poco, más por la práctica que por   un"},{"t":"p","x":"deliberado estudio de ellos."},{"t":"p","x":"Any se usa, por lo general, en las frases interrogativas, negativas o de duda."},{"t":"p","x":"Some se usa, en cambio, en las frases afirmativas."},{"t":"p","x":"Los ingleses a menudo usan some y any donde nosotros no usamos, por lo general, las palabras equivalentes a some y any."},{"t":"p","x":"A medida que usted avance en el dominio de la lengua inglesa, el correcto uso de some y any se irá haciendo perfectamente claro."},{"t":"p","x":"El cuidadoso estudio de los ejemplos que siguen le darán una idea general del uso de any y some."},{"t":"pre","x":"Give me some white wine   Déme vino blanco\nI have not any white wine   Yo no tengo vino blanco\nThen give me some water   Entonces, déme agua\nHave you any bread?   ¿Tiene usted pan?\nYes, I have some bread   Sí, yo tengo pan\nHave you any soap?   ¿Tiene usted jabón?\nHe has some soap   El tiene jabón\nHave you any daughters?   ¿Tiene usted hijas?\nGive me some papers, please   Déme papel, por favor\nI have some money for you   Yo tengo dinero para usted\nHave you any soap for me?   ¿Tiene usted jabón para mí?\nHave he any money?   ¿Tiene él dinero?"}]},{"id":"7-19","kind":"phrases","title":"Some y any: práctica","items":[{"es":"Déme vino blanco","en":"Give me some white wine"},{"es":"Yo no tengo vino blanco","en":"I have not any white wine"},{"es":"Entonces, déme agua","en":"Then give me some water"},{"es":"¿Tiene usted pan?","en":"Have you any bread?"},{"es":"Sí, yo tengo pan","en":"Yes, I have some bread"},{"es":"¿Tiene usted jabón?","en":"Have you any soap?"},{"es":"El tiene jabón","en":"He has some soap"},{"es":"¿Tiene usted hijas?","en":"Have you any daughters?"},{"es":"Déme papel, por favor","en":"Give me some papers, please"},{"es":"Yo tengo dinero para usted","en":"I have some money for you"},{"es":"¿Tiene usted jabón para mí?","en":"Have you any soap for me?"},{"es":"¿Tiene él dinero?","en":"Have he any money?"}],"note":""},{"id":"7-20","kind":"learn","title":"Expansiones","blocks":[{"t":"p","x":"Fácil es comprender las expansiones de palabras que por medio de un estiramiento de sus sentidos dan significados diferentes."},{"t":"p","x":"Comenzando por nosotros mismos, vemos la semejanza que existe entre algunas partes de nuestro cuerpo y ciertas cosas comunes."},{"t":"p","x":"Por ejemplo: El uso del brazo (arm) en las guerras de la antiguedad, ha hecho que parezca natural el llamar a los instrumentos de guerra arms (armas). Un determinado número de personas se convierte en un army (ejército)."},{"t":"p","x":"La palabra head (cabeza) puede ser usada para indicar la parte superior de las cosas: La cabeza de un bastón (the head of a stick), o para indicar lo que va adelante: La cabeza de un ejército (the head of an army)."},{"t":"p","x":"Foot (pie) se convierte principalmente en el nombre general que se da a una base: The foot of the building (la base del edificio)."},{"t":"p","x":"La conexión entre pata (leg) de un animal y la leg (pata) de una silla o cama, es siempre clara."},{"t":"p","x":"Estas expansiones en el significado de las palabras son fáciles de comprender, porque existen también en el castellano, y usted puede emplearlas como lo hace en este último idioma cuando, por ejemplo, dice: La boca (mouth) de una escopeta."},{"t":"p","x":"Estas y otras formas de extender el sentido de las palabras son sumamente sencillas, porque están en todos los idiomas y cualquiera puede entenderlas con facilidad y usarlas libremente."}]},{"id":"7-21","kind":"learn","title":"Pronombres posesivos","blocks":[{"t":"p","x":"Ya hemos estudiado los pronombres personales; ahora nos corresponde estudiar los pronombres posesivos, que le serán muy fáciles de comprender, porque se derivan de los pronombres personales, que el estudiante ya conoce por ser muy parecidos a ellos y porque muchos han sido estudiados en las lecciones pasadas."},{"t":"p","x":"Estudie atentamente todos los pronombres y los ejemplos de ellos que van a continuación:"},{"t":"pre","x":"You have a pencil   Usted tiene un lápiz\nYou have a pencil   Ustedes tienen un lápiz\nThis is your pencil   Este es su lápiz (de usted)\nThis pencil is yours   Este lápiz es suyo (de usted)\nThose pencils are yours   Esos lápices son suyos (de uds.)"},{"t":"p","x":"(de él)"},{"t":"pre","x":"He has a horse   El tiene un caballo\nThis is his horse   Este es su caballo (de él)\nThis horse is his   Este caballo es suyo (de él)\nThose horses are his   Esos caballos son suyos (de él)\nShe has a house   Ella tiene una casa\nThis is her house   Esta es su casa (de ella)\nThis house is hers   Esta casa es suya (de ella)\nThese houses are hers   Esas casas son suyas (de ella)"},{"t":"p","x":"(de él, de ella, de ello)"},{"t":"pre","x":"This is an old tree; it was   Este es un viejo árbol; él fue\nplanted by my father; its   plantado por mi padre; sus\nleaves are green; in summer   hojas son verdes; en verano\nit is full of flowers   él está lleno de flores"},{"t":"p","x":"nuestras nuestras"},{"t":"pre","x":"We have a farm   Nosotros tenemos una hacienda\nThis is our farm   Esta es nuestra hacienda\nThis farm is ours   Esta hacienda es nuestra\nThose farms are ours   Esas haciendas son nuestras\nTheirs (déaRs) .   Suyo, suya, suyos, suyas(de"},{"t":"p","x":"ellos, de ellas)"},{"t":"pre","x":"They have a boat   Ellos tienen un bote\nThis is their boat   Este es su bote (de ellos)\nThis boat is theirs   Este bote es suyo (de ellos)\nThose boats are theirs   Esos botes son suyos (de ellos)"}]},{"id":"7-22","kind":"phrases","title":"Pronombres posesivos: práctica","items":[{"es":"(Yo)","en":"(I)","ipa":"aɪ"},{"es":"Mi, mis","en":"My","p":"mái","ipa":"maɪ"},{"es":"Mío, mía, míos, mías","en":"Mine","p":"máin","ipa":"maɪn"},{"es":"Yo tengo un libro","en":"I have a book"},{"es":"(Usted)","en":"(You)","ipa":"ju"},{"es":"Su, sus (de usted, de ustedes)","en":"Your","p":"yúAR","ipa":"jɔɹ"},{"es":"Suyo, suya; suyos, suyas","en":"Yours","p":"yúARs","ipa":"jʊɹz"},{"es":"Esos lápices son suyos (de uds.)","en":"Those pencils are yours"},{"es":"(El)","en":"(He)","ipa":"hi"},{"es":"Su, sus, suyo, suya, suyos, suyas","en":"His","p":"jíz","ipa":"hɪz"},{"es":"El tiene un caballo","en":"He has a horse"},{"es":"Esos caballos son suyos (de él)","en":"Those horses are his"},{"es":"(Ella)","en":"(She)","ipa":"ʃi"},{"es":"Su, sus (de ella)","en":"Her","p":"jéeR","ipa":"hɝ"},{"es":"Suyos, suyas (de ella)","en":"Hers","p":"jéeRs","ipa":"hɚz"},{"es":"Ella tiene una casa","en":"She has a house"},{"es":"Esta es su casa (de ella)","en":"This is her house"},{"es":"Esta casa es suya (de ella)","en":"This house is hers"},{"es":"Esas casas son suyas (de ella)","en":"These houses are hers"},{"es":"(El, ella, ello, lo, la, le)","en":"(It)","ipa":"ɪt"},{"es":"Su, sus, suyo, suya, suyos, suyas","en":"Its","p":"íts","ipa":"ɪts"},{"es":"(Nosotros, nosotras)","en":"(We)","ipa":"wi"},{"es":"Nosotros tenemos una hacienda","en":"We have a farm"},{"es":"Esta es nuestra hacienda","en":"This is our farm"},{"es":"Esta hacienda es nuestra","en":"This farm is ours"},{"es":"Esas haciendas son nuestras","en":"Those farms are ours"},{"es":"(Ellos, ellas)","en":"(They)","ipa":"ðeɪ"},{"es":"Su, sus (de ellos, de ellas)","en":"Their","p":"déaR","ipa":"ðɛɹ"},{"es":"Ellos tienen un bote","en":"They have a boat"},{"es":"Esos botes son suyos (de ellos)","en":"Those boats are theirs"}],"note":""},{"id":"7-23","kind":"learn","title":"La idea de posesion","blocks":[{"t":"pre","x":"Para dar   una   idea   de   propiedad,   en   inglés   se   procede   de   dos"},{"t":"p","x":"maneras."},{"t":"p","x":"Tratándose de cosas, se usa of (The leaves of this tree = Las hojas de este árbol)."},{"t":"p","x":"Tratándose de seres vivientes, se prefiere colocar el nombre del poseedor seguido de 's y luego el objeto de su pertenencia (My father's hat = El sombrero de mi padre). El estudiante comprenderá fácilmente esto tan pronto domine las frases que van adelante."},{"t":"p","x":"Preg.- ¿Cómo se indica la idea de posesión en inglés?"},{"t":"p","x":"Resp.- Refiriéndose a seres vivientes, por medio de 's."}]},{"id":"7-24","kind":"learn","title":"Ejemplos","blocks":[{"t":"pre","x":"This is my mother's bed   Esta es la cama de mi madre\nThat is my friend's house   Esa es la casa de mi amigo\nThat is my father's house   Esa es la casa de mi padre\nThe horse's food   El alimento del caballo\nThose are my son's keys   Esas son las llaves de mi hijo\nThis is my son's room   Esta es la pieza de mi hijo"},{"t":"p","x":"Preg.-¿Puede usarse la forma 's tratándose de cosas?"},{"t":"p","x":"Resp.-No. Tratándose de cosas, la idea de posesión se indica con of."}]},{"id":"7-25","kind":"phrases","title":"Ejemplos: práctica","items":[{"es":"Esta es la cama de mi madre","en":"This is my mother's bed"},{"es":"Esa es la casa de mi amigo","en":"That is my friend's house"},{"es":"Esa es la casa de mi padre","en":"That is my father's house"},{"es":"El alimento del caballo","en":"The horse's food","ipa":"ðə ˈhɔɹsəz fud"},{"es":"Esas son las llaves de mi hijo","en":"Those are my son's keys"},{"es":"Esta es la pieza de mi hijo","en":"This is my son's room"}],"note":""},{"id":"7-26","kind":"learn","title":"Ejemplos","blocks":[{"t":"pre","x":"The leaves of the tree   Las hojas del árbol\nThe noise of the wind   El ruido del viento\nThe sound of the rain   El sonido de la lluvia\nThe smell of the flowers   El olor de las flores"},{"t":"ex","items":[["The noise of the wind","El ruido del viento"],["The sound of the rain","El sonido de la lluvia"],["The smell of the flowers","El olor de las flores"]]}]},{"id":"7-27","kind":"learn","title":"Pronombres reflexivos","blocks":[{"t":"p","x":"Cuando se desea dejar en claro que un acto fue hecho por una persona determinada, se añaden a los pronombres las terminaciones self o selves."},{"t":"p","x":"Esto es sencillo de comprender, y el estudiante lo asimilará sin sfuerzo cuando se familiarice con las palabras y frases siguientes: nuestras se, ellas se"}]},{"id":"7-28","kind":"vocab","title":"Pronombres reflexivos: práctica","items":[{"es":"Mismo. Sí mismo. Propio","en":"SELF","p":"sélf","ipa":"sɛlf"},{"es":"(Plural de self)","en":"SELVES","p":"sélvs","ipa":"sɛlvz"},{"es":"Mí, mis","en":"My","p":"mái","ipa":"maɪ"},{"es":"Yo mismo. Yo me","en":"Myself","p":"maisélf","ipa":"maɪˈsɛlf"},{"es":"Yo veré por mí mismo","en":"I will see for myself"},{"es":"Su, sus (de usted, de ustedes)","en":"Your","p":"yúAR","ipa":"jɔɹ"},{"es":"Haga eso usted mismo","en":"Do that yourself","ipa":"du ðæt jɚˈsɛlf"},{"es":"Hagan eso ustedes mismos","en":"Do that yourselves","ipa":"du ðæt jʊɹˈsɛlvz"},{"es":"Le, lo (a él)","en":"Him","p":"jím","ipa":"hɪm"},{"es":"El mismo, él se","en":"Himself","p":"jimsélf","ipa":"hɪmˈsɛlf"},{"es":"El ir él mismo","en":"He will go himself"},{"es":"Su, sus (de ella)","en":"Her","p":"jéeR","ipa":"hɝ"},{"es":"Ella misma; ella se","en":"Herself","p":"jéeRsélf","ipa":"hɚˈsɛlf"},{"es":"Ella vino ella misma","en":"She came herself","ipa":"ʃi keɪm hɚˈsɛlf"},{"es":"El, ella, ello, lo, la, le","en":"It","p":"ít","ipa":"ɪt"},{"es":"El mismo, la misma (neutro)","en":"Itself","p":"itsélf","ipa":"ɪtˈsɛlf"},{"es":"Nosotros mismos; nosotras mismas","en":"Ourselves","p":"auARsélvs","ipa":"aʊɚˈsɛlvz"},{"es":"Les (a ellos, a ellas)","en":"Them","p":"dem","ipa":"ðɛm"},{"es":"Ellos fueron ellos mismos","en":"They went themselves","ipa":"ðeɪ wɛnt ðɛmˈsɛlvz"}],"note":""},{"id":"7-29","kind":"learn","title":"Importancia de los pronombres ingleses","blocks":[{"t":"p","x":"La importancia de los pronombres es en inglés muy grande, ya que careciendo este idioma de las inflexiones verbales castellanas, su correcto uso se hace indispensable para todo estudiante que quiera aprenderá a hablar rápida y correctamente el idioma inglés."},{"t":"p","x":"Como lo hemos explicado ya, los estudiantes que conocen bien la gramática castellana podrán comprender fácilmente el uso de los"},{"t":"pre","x":"pronombres   ingleses;  pero   aquellos  que   no   tienen  estos"},{"t":"p","x":"conocimientos, encontrarán dificultades y deberán, por lo tanto, detenerse un mayor tiempo en la completa asimilación de todos los pronombres ingleses."},{"t":"p","x":"Para ayudar a asimilarlos en forma completa, vamos a repasarlos todos en conjunto."},{"t":"p","x":"Yourselves (yuARsélvs). Ustedes mismos, ustedes se Ourselves (auaRsélvs) . Nosotros mismos, nosotras mismas Themselves (demsélvs) . Ellos mismos ,ellas mismas ,ellos se ,ellas se Esta séptima lección, que aquí termina es sumamente importante y en ningún caso debe el estudiante seguir avanzando sin estar seguro de que ha comprendido todo lo que en ella se explica."},{"t":"p","x":"No debe olvidarse nunca la absoluta necesidad de usar los pronombres ingleses en todo momento. En castellano no es necesario expresar de continuo los pronombres, y, más aún, la mayor parte de ellos suelen omitirse. Esto es algo que nunca se debe hacer en inglés, porque si se omiten los pronombres las frases que se forman sin ellos serán casi siempre incorrectas."}]},{"id":"7-30","kind":"vocab","title":"Importancia de los pronombres ingleses: práctica","items":[{"es":"Yo","en":"I","p":"ái","ipa":"aɪ"},{"es":"Mí, me","en":"Me","p":"míi","ipa":"mi"},{"es":"Mi, mis","en":"My","p":"mái","ipa":"maɪ"},{"es":"Mío, mía, míos, mías","en":"Mine","p":"máin","ipa":"maɪn"},{"es":"Yo mismo, yo me","en":"Myself","p":"máiself","ipa":"maɪˈ ","en":"Because","p":"bicóz","ipa":"bɪˈkɔz"},{"es":"Misa","en":"Mass","p":"más","ipa":"mæs"},{"es":"Pintura","en":"Paint","p":"péint","ipa":"peɪnt"},{"es":"Pintado, pintada","en":"Painted","p":"péinted","ipa":"ˈpeɪntɪd"},{"es":"Nube","en":"Cloud","p":"cláud","ipa":"klaʊd"},{"es":"Nublado","en":"Clouded","p":"claudid","ipa":"ˈklaʊdɪd"}],"note":""},{"id":"8-5","kind":"learn","title":"Comparativos","blocks":[{"t":"p","x":"Los comparativos y superlativos en inglés se forman como en castellano, anteponiendo la palabra MAS (more) y EL MAS (the most) delante del adjetivo."},{"t":"p","x":"Sin embargo, cuando las palabras son cortas, en vez de usar more y most se prefiere agregar la terminación er y est al adjetivo."},{"t":"p","x":"Para los comparativos de inferioridad se usa LESS (lés), que corresponde a menos, y LEAST (líist), que corresponde a el menos."}]},{"id":"8-6","kind":"vocab","title":"Comparativos: práctica","items":[{"es":"Más","en":"More","p":"móoR","ipa":"mɔɹ"},{"es":"El más","en":"The most","p":"di móUst","ipa":"ðə moʊst"},{"es":"Hermoso","en":"Beautiful","p":"biútiful","ipa":"ˈbjutəfəl"},{"es":"Más hermoso","en":"More beautiful","ipa":"mɔɹ ˈbjutəfəl"},{"es":"El más hermoso","en":"The most beautiful","ipa":"ðə moʊst ˈbjutəfəl"},{"es":"Necesario","en":"Necessary","p":"nésesari","ipa":"ˈnɛsəsɛɹi"},{"es":"Más necesario","en":"More necessary","ipa":"mɔɹ ˈnɛsəsɛɹi"},{"es":"El más necesario","en":"The most necessary","ipa":"ðə moʊst ˈnɛsəsɛɹi"},{"es":"Frecuente","en":"Frequent","p":"frícuent","ipa":"ˈfɹikwənt"},{"es":"Más frecuente","en":"More frequent","ipa":"mɔɹ ˈfɹikwənt"},{"es":"El más frecuente","en":"The most frequent","ipa":"ðə moʊst ˈfɹikwənt"},{"es":"Diferente","en":"Different","p":"díferent","ipa":"ˈdɪfɚənt"},{"es":"Más diferente","en":"More different","ipa":"mɔɹ ˈdɪfɚənt"},{"es":"El más diferente","en":"The most different","ipa":"ðə moʊst ˈdɪfɚənt"},{"es":"Largo","en":"Long","p":"lóng","ipa":"lɔŋ"},{"es":"Más largo","en":"Longer","p":"lóngueR","ipa":"ˈlɔŋ  as yesterday   Hace tanto frío como ayer\nHe is as strong as you   El es tan fuerte como usted"}]},{"id":"8-10","kind":"phrases","title":"As... As: práctica","items":[{"es":"Yo soy tan viejo como su hermano (Yo","en":"I am as old as your brother"},{"es":"Danubio","en":"Danube","ipa":"ˈdænjub"},{"es":"Hace tanto frío como ayer","en":"It is as cold as yesterday"},{"es":"El es tan fuerte como usted","en":"He is as strong as you"}],"note":""},{"id":"8-11","kind":"learn","title":"Comparativos irregulares","blocks":[{"t":"p","x":"Hay un pequeño grupo de palabras que forman sus comparativos en forma irregular."},{"t":"p","x":"A continuación damos dichas palabras para que el estudiante las aprenda de memoria:"},{"t":"p","x":"Estudie cuidadosamente las siguientes frases:"},{"t":"pre","x":"I am better   Yo estoy mejor\nI am worse   Yo estoy peor\nToday my father is worse   Hoy mi padre está peor\nI have less money this year   Yo tengo menos dinero este año\nThis is his best work   Este es su mejor trabajo\nI am worse than yesterday   Yo estoy peor que ayer\nThese are my best shoes   Estos son mis mejores zapatos\nI am better this morning   Yo estoy mejor esta mañana\nHe is my best friend   El es mi mejor amigo\nThat is a good idea   Esa es una buena idea\nHe is a good boy   El es un buen niño"}]},{"id":"8-12","kind":"vocab","title":"Comparativos irregulares: práctica","items":[{"es":"Poco","en":"Little","p":"lítEl","ipa":"ˈlɪtəl"},{"es":"Menos","en":"Less","p":"lés","ipa":"lɛs"},{"es":"El menos","en":"Least","p":"líist","ipa":"list"},{"es":"Lejos","en":"Far","p":"fáarR","ipa":"fɑɹ"},{"es":"Más lejos","en":"Farther","p":"fáaRdeR","ipa":"ˈfɑɹðɚ"},{"es":"El más lejos","en":"Farthest","p":"fáaRdest","ipa":"ˈfɑɹðəst"},{"es":"Bueno","en":"Good","p":"gúd","ipa":"ɡʊd"},{"es":"Mejor","en":"Better","p":"béteR","ipa":"ˈbɛtɚ"},{"es":"El mejor","en":"Best","p":"bést","ipa":"bɛst"},{"es":"Malo","en":"Bad","p":"bád","ipa":"bæd"},{"es":"Peor","en":"Worse","p":"uéeRs","ipa":"wɝs"},{"es":"Pésimo","en":"Worst","p":"uéeRst","ipa":"wɝst"},{"es":"Yo estoy mejor","en":"I am better","ipa":"aɪ æm ˈbɛtɚ"},{"es":"Yo estoy peor","en":"I am worse","ipa":"aɪ æm wɝs"},{"es":"Hoy mi padre está peor","en":"Today my father is worse"},{"es":"Yo tengo menos dinero este año","en":"I have less money this year"},{"es":"Yo estoy peor que ayer","en":"I am worse than yesterday"},{"es":"Yo estoy mejor esta mañana","en":"I am better this morning"},{"es":"El es mi mejor amigo","en":"He is my best friend"},{"es":"Esa es una buena idea","en":"That is a good idea"},{"es":"El es un buen niño","en":"He is a good boy"}],"note":""},{"id":"8-13","kind":"learn","title":"Nuevas palabras","blocks":[{"t":"p","x":"Aprenda de memoria las palabras siguientes:"}]},{"id":"8-14","kind":"vocab","title":"Nuevas palabras: práctica","items":[{"es":"Nave, buque","en":"Ship","p":"SHíip","ipa":"ʃɪp"},{"es":"Hasta","en":"Till","p":"tíl","ipa":"tɪl"},{"es":"De, desde","en":"From","p":"fróm","ipa":"fɹʌm"},{"es":"Labio","en":"Lip","p":"líp","ipa":"lɪp"},{"es":"Aguja","en":"Needle","p":"níidEl","ipa":"ˈnidəl"},{"es":"Hilo","en":"Thread","p":"zréed","ipa":"θɹɛd"},{"es":"Algodón","en":"Cotton","p":"cótOn","ipa":"ˈkɑtən"},{"es":"Seda","en":"Silk","p":"sílk","ipa":"sɪlk"},{"es":"Alfiler","en":"Pin","p":"pin","ipa":"pɪn"},{"es":"Canasto","en":"Basquet","p":"báaskEt"},{"es":"Caja","en":"Box","p":"bóks","ipa":"bɑks"},{"es":"Cajón","en":"Drawer","p":"dróoR","ipa":"dɹɔɹ"},{"es":"Verso","en":"Verse","p":"vérs","ipa":"vɝs"},{"es":"Industria","en":"Industry","p":"índastri","ipa":"ˈɪndəstɹi"}],"note":""},{"id":"8-15","kind":"learn","title":"Opuestos","blocks":[{"t":"p","x":"First is the opposite of Last Primero es lo opuesto de Último Go is the opposite of Come Ir es lo puesto de Venir Put is the opposite of Take Poner es lo opuesto de Tomar"}]},{"id":"8-16","kind":"vocab","title":"Opuestos: práctica","items":[{"es":"Primero","en":"First","p":"féRst","ipa":"fɝst"},{"es":"Ultimo","en":"Last","p":"láast","ipa":"læst"},{"es":"Ir","en":"Go","p":"góU","ipa":"ɡoʊ"},{"es":"Venir","en":"Come","p":"cám","ipa":"kʌm"},{"es":"Poner","en":"Put","p":"pút","ipa":"pʊt"},{"es":"Tomar","en":"Take","p":"téik","ipa":"teɪk"}],"note":""},{"id":"8-17","kind":"learn","title":"La negacion en tiempo presente (do not)","blocks":[{"t":"p","x":"Es muy sencillo formar las frases negativas en tiempo presente."},{"t":"p","x":"Basta para ello anteponer al verbo las palabras DO NOT (dúu not), on las cuales se indica que dicho verbo va en forma negativa."},{"t":"p","x":"Do not se convierte en DOES NOT (dás nót) hablando de él o de ella."},{"t":"p","x":"Estudiando las formas verbales que van a continuación no tendrá dificultad alguna en comprender el sencillo uso de do not, que equivale a la palabra castellana no en las frases negativas del tiempo presente."},{"t":"p","x":"Preg.- ¿Cómo se forma la negación inglesa de tiempo presente?"},{"t":"p","x":"Resp.- Anteponiendo do not delante del verbo se forma la negación del tiempo presente."},{"t":"p","x":"Mientras no se haya familiarizado el estudiante con las formas verbales que siguen, no continúe adelante; este libro le permitirá hablar inglés en un plazo sumamente breve, siempre que cumpla con las instrucciones de estudiar con calma y de dominar enteramente cada una de las lecciones antes de continuar con la que sigue."}]},{"id":"8-18","kind":"phrases","title":"La negacion en tiempo presente (do not): práctica","items":[{"es":"Yo mantengo","en":"I keep","ipa":"aɪ kip"},{"es":"Yo no mantengo","en":"I do not keep"},{"es":"Ellos vienen","en":"They come","ipa":"ðeɪ kʌm"},{"es":"Ellos no vienen","en":"They do not come"},{"es":"Yo digo","en":"I say","ipa":"aɪ seɪ"},{"es":"Yo no digo","en":"I do not say"},{"es":"Ella toma","en":"She takes","ipa":"ʃi teɪks"},{"es":"Ella no toma","en":"She does not take"},{"es":"El hace","en":"He makes","ipa":"hi meɪks"},{"es":"El no hace","en":"He does not make"},{"es":"Ella consigue","en":"She gets","ipa":"ʃi ɡɛts"},{"es":"Ella no consigue"," xplicación sería inútil pérdida de tiempo."},{"t":"p","x":"Preg.- ¿Cómo se forman las frases negativas inglesas en tiempo pasado?"},{"t":"p","x":"Resp.- Anteponiendo did not al verbo, que va en tiempo presente."},{"t":"p","x":"Familiarícese con las formas verbales que van a continuación:"}]},{"id":"8-20","kind":"phrases","title":"La negacion en tiempo pasado (did not): práctica","items":[{"es":"Ellos envían","en":"They send","ipa":"ðeɪ sɛnd"},{"es":"Ellos enviaron","en":"They sent","ipa":"ðeɪ sɛnt"},{"es":"Ellos no enviaron","en":"They did not send"},{"es":"Nosotros damos","en":"We give","ipa":"wi ɡɪv"},{"es":"Nosotros dimos","en":"We gave","ipa":"wi ɡeɪv"},{"es":"Nosotros no dimos","en":"We did not give"},{"es":"El consigue","en":"He gets","ipa":"hi ɡɛts"},{"es":"El consiguió","en":"He got","ipa":"hi ɡɑt"},{"es":"El no consiguió","en":"He did not get"},{"es":"Ella deja","en":"She lets","ipa":"ʃi lɛts"},{"es":"Ella dejó","en":"She let","ipa":"ʃi lɛt"},{"es":"Ella no dejó","en":"She did not let"},{"es":"Nosotros hacemos","en":"We make","ipa":"wi meɪk"},{"es":"Nosotros hicimos","en":"We made","ipa":"wi meɪd"},{"es":"Nosotros no hicimos","en":"We did not made"},{"es":"Ellos toman","en":"They take","ipa":"ðeɪ teɪk"},{"es":"Ellos tomaron","en":"They took","ipa":"ðeɪ tʊk"},{"es":"Ellos no tomaron","en":"They did not take"},{"es":"El deja","en":"He lets","ipa":"hi lɛts"},{"es":"El dejó","en":"He let","ipa":"hi lɛt"},{"es":"El no dejó","en":"He did not let"},{"es":"Nosotros pusimos","en":"We put","ipa":"wi pʊt"},{"es":"Nosotros no pusimos","en":"We did not put"},{"es":"Yo digo","en":"I say","ipa":"aɪ seɪ"},{"es":"Yo no dije","en":"I did not say"},{"es":"Ellos no hicieron","en":"They did not make"},{"es":"Yo no tomé","en":"I did not take"},{"es":"Nosotros no mantuvimos","en":"We did not keep"},{"es":"Yo no di","en":"I did not give"},{"es":"Ellos no pusieron","en":"They did not put"},{"es":"Yo no fui","en":"I did not go"},{"es":"Yo no conseguí","en":"I did not get"},{"es":"Ellos no vinieron","en":"They did not come"},{"es":"El no fue","en":"He did not go"},{"es":"Ellos no mantuvieron","en":"They did not keep"},{"es":"Nosotros no dimos","en":"Wedid not give"},{"es":"Yo no hice","en":"I did not do"},{"es":"Yo no hice","en":"I did not make"}],"note":""},{"id":"8-21","kind":"learn","title":"La negacion de \"to have\" y \"to be\" (en presente y pasado)","blocks":[{"t":"p","x":"(en tiempo presente y pasado) El lector habrá observado lo sencillo que es, con el uso del do not, does not o did not, formar las frases negativas en los tiempos presentes y pasado."},{"t":"p","x":"La negación se construye en esa forma con todos los verbos, con excepción de to be y to have, los cuales no necesitan de do not o did not y solo emplean la palabra not o no, que va después del verbo to have o del verbo to be."},{"t":"p","x":"Preg.- ¿Cómo se forman las frases negativas en los verbos to have y to be?"},{"t":"p","x":"Resp.- Poniendo la palabra no o not después del verbo se formanlas frases negativas en tiempo presente y pasado de los verbos to have y to be."},{"t":"p","x":"Estudie cuidadosamente las siguientes frases:"},{"t":"pre","x":"I have no money   Yo no tengo dinero\nShe is not here   Ella no está aquí\nHe is not very well   El no está muy bien\nWe have no friends here   No tenemos amigos aquí\nHe was not ill   El no estaba enfermo\nI have no brothers   Yo no tengo hermanos\nHe had no letter for you   El no tenía carta para usted"},{"t":"p","x":"Usted debe usar la palabra no en las frases negativas del verbo to have y la palabea not con las frases negativas del verbo to be."},{"t":"pre","x":"I was not tired   Yo no estaba cansado\nThat poor man has no shoes   Ese pobre hombre no tiene"},{"t":"p","x":"zapatos"},{"t":"pre","x":"He was not very angry   El no estaba muy enojado\nHe was not on the train   El no estaba en el tren\nYour father is not in my house   Su padre no está en mi casa"}]},{"id":"8-22","kind":"phrases","title":"La negacion de \"to have\" y \"to be\" (en presente y pasado): práctica","items":[{"es":"Yo no tengo dinero","en":"I have no money"},{"es":"Ella no está aquí","en":"She is not here"},{"es":"El no está muy bien","en":"He is not very well"},{"es":"No tenemos amigos aquí","en":"We have no friends here"},{"es":"El no estaba enfermo","en":"He was not ill"},{"es":"Yo no tengo hermanos","en":"I have no brothers"},{"es":"El no tenía carta para usted","en":"He had no letter for you be."},{"es":"Yo no estaba cansado","en":"I was not tired"},{"es":"Ese pobre hombre no tiene","en":"That poor man has no shoes zapatos"},{"es":"El no estaba muy enojado","en":"He was not very angry"},{"es":"El no estaba en el tren","en":"He was not on the train"},{"es":"Su padre no está en mi casa","en":"Your father is not in my house"}],"note":""},{"id":"8-23","kind":"learn","title":"La negacion en tiempo futuro","blocks":[{"t":"p","x":"La negación en tiempo futuro sólo exige colocar la palabra not entre will y el nombre del verbo."},{"t":"pre","x":"He will not go with you   El no irá con usted\nI will not do that   Yo no haré eso\nShe will not come till tomorrow   Ella no vendrá hasta mañana\nWe will not do that work   Nos no haremos ese trabajo"}]},{"id":"8-24","kind":"phrases","title":"La negacion en tiempo futuro: práctica","items":[{"es":"El no irá con usted","en":"He will not go with you"},{"es":"Yo no haré eso","en":"I will not do that"},{"es":"Ella no vendrá hasta mañana","en":"She will not come till tomorrow"},{"es":"Nos no haremos ese trabajo","en":"We will not do that work"}],"note":""},{"id":"8-25","kind":"learn","title":"LA NEGACION CON WOULD, MAY o MIGHT","blocks":[{"t":"p","x":"Tampoco ofrece ninguna dificultad formar la negación inglesa en los tiempos que exigen el uso de would, may o might, para lo cual basta colocar not entre would, may o might y el nombre del verbo."},{"t":"p","x":"Los ejemplos que siguen le enseñarán claramente la negación con would, may y might."},{"t":"pre","x":"I would not do that   Yo no haría eso\nI may not do that   Yo no puedo hacer eso\nHe may not go till tomorrow   El no puede ir hasta mañana\nHe might not go till tomorrow   El no podría ir hasta mañana\nThey might not go   Ellos no podrían ir\nThey would not come till tomorrow   Ellos no vendrían hasta mañana"}]},{"id":"8-26","kind":"phrases","title":"LA NEGACION CON WOULD, MAY o MIGHT: práctica","items":[{"es":"Yo no haría eso","en":"I would not do that"},{"es":"Yo no puedo hacer eso","en":"I may not do that"},{"es":"El no puede ir hasta mañana","en":"He may not go till tomorrow"},{"es":"El no podría ir hasta mañana","en":"He might not go till tomorrow"},{"es":"Ellos no podrían ir","en":"They might not go"},{"es":"Ellos no vendrían hasta mañana","en":"They would not come till tomorrow"}],"note":""},{"id":"8-27","kind":"learn","title":"CONTRACCIONES DEL VERBO TO BE y TO HAVE","blocks":[{"t":"p","x":"Es muy común en inglés usar ciertas contracciones con los verbos to be y to have. Aunque el estudiante no está obligado a emplear estas contracciones, son ellas tan usadas por los ingleses y, por otra parte, son tan sencillas de comprender, que conviene que usted aprenda de memoria las más usadas, las cuales indicamos a continuación:"},{"t":"pre","x":"I am = I'm (áim)   |   I have = I've (áiv)\nYou are = you're (yúur)   |   You have = You've (yúuv)\nHe is = He's (jíiz)   |   He has = He's (jíiz)\nShe is = She's (SHíiz)   |   It has = It's (its)\nIt is = It's (íts)   |   She has = She's (shíiz)\nWe are = We're (uieR)   |   We have = We've (uív)\nThey are = They're (déir)   |   They have = They've (déiv)"},{"t":"p","x":"Estudie cuidadosamente las frases que van a continuación:"},{"t":"pre","x":"I'm ill   Yo estoy enfermo\nWe're late   Nosotros estamos atrasados\nThey've done their work   Ellos han hecho su trabajo\nHe's gone to Santiago   El ha ido a Santiago\nHe's in Santiago   El está en Santiago\nWe're in the garden   Nosotros estamos en el jardín\nShe's very beautiful   Ella es muy hermosa\nYou're wrong   Usted está equivocado\nThey've a house in the country   Ellos tienen una casa en elcampo\nHe's ill in bed   El está enfermo en cama\nThey've a beautiful daughter   Ellos tienen una hermosa hija"}]},{"id":"8-28","kind":"phrases","title":"CONTRACCIONES DEL VERBO TO BE y TO HAVE: práctica","items":[{"es":"Yo estoy enfermo","en":"I'm ill","ipa":"aɪm ɪl"},{"es":"Nosotros estamos atrasados","en":"We're late","ipa":"wiɹ leɪt"},{"es":"Ellos han hecho su trabajo","en":"They've done their work"},{"es":"El ha ido a Santiago","en":"He's gone to Santiago"},{"es":"El está en Santiago","en":"He's in Santiago","ipa":"hiz ɪn sæntiˈɑɡoʊ"},{"es":"Nosotros estamos en el jardín","en":"We're in the garden"},{"es":"Ella es muy hermosa","en":"She's very beautiful","ipa":"ʃiz ˈvɛɹi ˈbjutəfəl"},{"es":"Ellos tienen una casa en elcampo","en":"They've a house in the country"},{"es":"El está enfermo en cama","en":"He's ill in bed"},{"es":"Ellos tienen una hermosa hija","en":"They've a beautiful daughter"}],"note":""},{"id":"8-29","kind":"learn","title":"Contracciones inglesas","blocks":[{"t":"p","x":"Estudiemos ahora otras contracciones de gran uso."},{"t":"pre","x":"I will = I'll (áil)   |   I will not = I won't (ái uóUnt)\nYou will = You'll (yúul)   |   You will not = You won't\nHe will = He'll (jíil)   |   He will not = He won't\nShe will = She'll (SHíil)   |   She will not = She won't\nWe will = We'll (uíil)   |   We will not = We won't\nThey will = They'll (déil)   |   They will not = They won't\nI'll see you tomorrow   |   Yo le veré mañana\nHe'll go to London   El irá a Londres\nWe won't do that   Nosotros no haremos eso\nShe won't go   Ella no irá\nI won't do this work   Yo no haré este trabajo\nI do not   = I don't (ái doUnt)"},{"t":"p","x":"He does not = He doesn't (jíi dázEnt) She does not = She doesn't"},{"t":"pre","x":"We do not   = We don't\nYou do not   = You don't"},{"t":"p","x":"They do not = They don't"},{"t":"pre","x":"I don't see why you did that   Yo no veo por qué usted hizo eso\nHe doesn't go to mass   El no va a misa\nI did not   = I didn't (ái dídEnt)"},{"t":"p","x":"You did not = You didn't"},{"t":"pre","x":"He did not   = He didn't"},{"t":"p","x":"She did not = She didn't"},{"t":"pre","x":"We did did   = We didn't"},{"t":"p","x":"They did not = They didn't"},{"t":"pre","x":"I didn't come with him   Yo no vine con él\nThey didn't get the money   Ellos no consiguieron el dinero\nI didn't see your house   Yo no ví su casa"}]},{"id":"8-30","kind":"phrases","title":"Contracciones inglesas: práctica","items":[{"es":"El irá a Londres","en":"He'll go to London"},{"es":"Nosotros no haremos eso","en":"We won't do that"},{"es":"Ella no irá","en":"She won't go","ipa":"ʃi woʊnt ɡoʊ"},{"es":"Yo no haré este trabajo","en":"I won't do this work"},{"es":"= I don't (ái doUnt)","en":"I do not","ipa":"aɪ du nɑt"},{"es":"= We don't","en":"We do not","ipa":"wi du nɑt"},{"es":"= You don't","en":"You do not","ipa":"ju du nɑt"},{"es":"Yo no veo por qué usted hizo eso","en":"I don't see why you did that"},{"es":"El no va a misa","en":"He doesn't go to mass"},{"es":"= I didn't (ái dídEnt)","en":"I did not","ipa":"aɪ dɪd nɑt"},{"es":"= He didn't","en":"He did not","ipa":"hi dɪd nɑt"},{"es":"= We didn't","en":"We did did","ipa":"wi dɪd dɪd"},{"es":"Yo no vine con él","en":"I didn't come with him"},{"es":"Ellos no consiguieron el dinero","en":"They didn't get the money"}],"note":""},{"id":"8-31","kind":"phrases","title":"Ejercicios de perfeccionamiento","items":[{"es":"El está trabajando","en":"He is working","ipa":"hi ɪz ˈwɝkɪŋ"},{"es":"El no está trabajando","en":"He is not working"},{"es":"El estaba trabajando","en":"He was working","ipa":"hi wɑz ˈwɝkɪŋ"},{"es":"El no estaba trabajando","en":"He was not working"},{"es":"El estará trabajando","en":"He will be working"},{"es":"El no estará trabajando","en":"He will not be working"},{"es":"Yo voy a su casa","en":"I go to his house"},{"es":"Yo no voy a su casa","en":"I do not go to his house"},{"  of wine","a":["Un vaso de vino"]},{"q":"A look of surprise","a":["Una mirada de sorpresa"]},{"q":"The most beautiful","a":["El más hermoso","La más hermosa"]},{"q":"The least necessary","a":["El menos necesario"]},{"q":"She is older than you","a":["Ella es mayor que usted","Ella es más vieja que usted","Ella tiene más edad que usted"]},{"q":"He is as strong as you","a":["Él es tan fuerte como usted"]}]},{"title":"c) Traduce al inglés","kind":"en","items":[{"q":"Estaba lloviendo","a":["It was raining"]},{"q":"Hace calor","a":["It is warm","It is hot"]},{"q":"Hace frío","a":["It is cold"]},{"q":"Hace mucho frío","a":["It is very cold"]},{"q":"Su hija está aquí","a":["Your daughter is here","His daughter is here","Her daughter is here"]},{"q":"Nosotros iremos allá hoy","a":["We will go there today"]},{"q":"Un pedazo de pan","a":["A bit of bread"]},{"q":"Un pedazo de azúcar","a":["A bit of sugar"]},{"q":"Una gota de agua","a":["A drop of water"]},{"q":"Hace más frío que ayer","a":["It is colder than yesterday"]},{"q":"Hace tanto frío como ayer","a":["It is as cold as yesterday"]}]},{"title":"d) Pregunta","kind":"open","items":[{"q":"¿Cómo se forman el comparativo y el superlativo cuando las palabras son largas?","a":["Anteponiendo more (más) y the most (el más) al adjetivo."]}]},{"title":"e) Pregunta","kind":"open","items":[{"q":"¿Y cuando se trata de palabras cortas?","a":["Agregando al adjetivo las terminaciones er y est (long, longer, longest)."]}]},{"title":"f) Pregunta","kind":"open","items":[{"q":"¿Cuándo se usa an en vez de a?","a":["Cuando la palabra siguiente comienza con vocal (an apple)."]}]},{"title":"g) Pregunta","kind":"open","items":[{"q":"¿Cómo forman generalmente el plural los sustantivos terminados en y?","a":["Sustituyendo la y por ies (body → bodies), salvo que antes de la y haya una vocal (day → days)."]}]},{"title":"h) Traduce al castellano","kind":"es","items":[{"q":"He has answered my letter","a":["Él ha contestado mi carta","Él ha respondido mi carta"]},{"q":"We have painted this house","a":["Nosotros hemos pintado esta casa"]},{"q":"She has ironed your shirt","a":["Ella ha planchado su camisa","Ella ha planchado tu camisa"]},{"q":"The sky was clouded","a":["El cielo estaba nublado"]},{"q":"He is doing his work","a":["Él está haciendo su trabajo"]},{"q":"I will do that tomorrow","a":["Yo haré eso mañana","Haré eso mañana"]}]}]}]},{"n":9,"title":"Novena lección","sub":"Preguntas, palabras interrogativas, there is/are","goal":"Hacer cualquier pregunta con do/did/will y las palabras interrogativas.","steps":[{"id":"9-1","kind":"learn","title":"Presente interrogativo (con do)","blocks":[{"t":"p","x":"Hay varias maneras de formar el interrogativo en inglés."},{"t":"p","x":"Comenzaremos por aprender a hacer preguntas usando la palabra DO (dú). Este término cuando ayuda a formar la interrogación no tiene ningún valor propio; sólo está indicando que el verbo va en forma interrogativa."},{"t":"p","x":"Para interrogar en tiempo presente con la palabra do basta ante poner ésta al pronombre personal."},{"t":"pre","x":"They send ....... Ellos envían   |   You go ........ Usted va\nDo they send? ... ¿Envían ellos? |   Do you go? .... ¿Va usted?"},{"t":"p","x":"Hay una sola pequeña excepción, y ella es la necesidad de usar DOES (das) en vez de DO cuando se habla de la tercera persona del singular, es decir, cuando hablamos de él o ella."},{"t":"pre","x":"She sends ....... Ella envía   |   He goes ....... El va\nDoes she send? .. ¿Envía ella?   |   Does he go? ... ¿Va él?"},{"t":"p","x":"Usted ya ha estudiado que hablando de he o de she se agrega, en tiempo presente, una s al verbo; pero advierta que usando el verbo en forma interrogativa no se agrega dicha s."},{"t":"p","x":"Preg.- ¿Cómo se forma el interrogativo inglés con la palabra do?"},{"t":"p","x":"Resp.- Colocando do delante de los pronombres personales."},{"t":"p","x":"Preg.- ¿Cuándo se interroga con does?"},{"t":"p","x":"Resp.- Hablando de él o de ella."},{"t":"p","x":"Para fijar permanentemente en su cerebro la interrogación hecha con la palabra do, deberá estudiar hasta que le sea posible traducir, sin esfuerzo y en forma instantánea, todas las formas verbales de esta página."},{"t":"pre","x":"You take   Usted toma\nDo you take?   ¿Toma usted?\nWe see   Nosotros vemos\nDo we see?   ¿Vemos nosotros?\nYou say   Usted dice\nDo you say?   ¿Dice usted?\nShe comes   Ella viene\nDoes she come?   ¿Viene ella?\nThey go   Ellos van\nDo they go?   ¿Van ellos?\nI send   Yo envío\nDo I send?   ¿Envío yo?\nDoes she go?   ¿Ella va?\nDo we go?   ¿Vamos nosotros?\nDo I make?   ¿Hago yo?\nDoes she come?   ¿Viene ella?\nDoes she send?   ¿Envía ella?\nDo they take?   ¿Toman ellos?\nDoes he go?   ¿Va él?\nDo you put?   ¿Pone usted?\nDo I say?   ¿Digo yo?\nDo you keep?   ¿Mantiene usted?\nDo they put?   ¿Ponen ellos?\nDoes he let?   ¿Dejan ellos?\nDo we give?   ¿Damos nosotros?\nDo they get?   ¿Consiguen ellos?"}]},{"id":"9-2","kind":"phrases","title":"Presente interrogativo (con do): práctica","items":[{"es":"Ellos envían","en":"They send","ipa":"ðeɪ sɛnd"},{"es":"¿Envían ellos?","en":"Do they send?","ipa":"du ðeɪ sɛnd"},{"es":"¿Va usted?","en":"Do you go?","ipa":"du ju ɡoʊ"},{"es":"Ella envía","en":"She sends","ipa":"ʃi sɛndz"},{"es":"El va","en":"He goes","ipa":"hi ɡoʊz"},{"es":"¿Envía ella?","en":"Does she send?","ipa":"dʌz ʃi sɛnd"},{"es":"¿Toma usted?","en":"Do you take?","ipa":"du ju teɪk"},{"es":"Nosotros vemos","en":"We see","ipa":"wi si"},{"es":"¿Vemos nosotros?","en":"Do we see?","ipa":"du wi si"},{"es":"¿Dice usted?","en":"Do you say?","ipa":"du ju seɪ"},{"es":"Ella viene","en":"She comes","ipa":"ʃi kʌmz"},{"es":"¿Viene ella?","en":"Does she come?","ipa":"dʌz ʃi kʌm"},{"es":"Ellos van","en":"They go","ipa":"ðeɪ ɡoʊ"},{"es":"¿Van ellos?","en":"Do they go?","ipa":"du ðeɪ ɡoʊ"},{"es":"Yo envío","en":"I send","ipa":"aɪ sɛnd"},{"es":"¿Envío yo?","en":"Do I send?","ipa":"du aɪ sɛnd"},{"es":"¿Ella va?","en":"Does she go?","ipa":"dʌz ʃi ɡoʊ"},{"es":"¿Vamos nosotros?","en":"Do we go?","ipa":"du wi ɡoʊ"},{"es":"¿Hago yo?","en":"Do I make?","ipa":"du aɪ meɪk"},{"es":"¿Toman ellos?","en":"Do they take?","ipa":"du ðeɪ teɪk"},{"es":"¿Va él?","en":"Does he go?","ipa":"dʌz hi ɡoʊ"},{"es":"¿Pone usted?","en":"Do you put?","ipa":"du ju pʊt"},{"es":"¿Digo yo?","en":"Do I say?","ipa":"du aɪ seɪ"},{"es":"¿Mantiene usted?","en":"Do you keep?","ipa":"du ju kip"},{"es":"¿Ponen ellos?","en":"Do they put?","ipa":"du ðeɪ pʊt"},{"es":"¿Dejan ellos?","en":"Does he let?","ipa":"dʌz hi lɛt"},{"es":"¿Damos nosotros?","en":"Do we give?","ipa":"du wi ɡɪv"},{"es":"¿Consiguen ellos?","en":"Do they get?","ipa":"du ðeɪ ɡɛt"}],"note":""},{"id":"9-3","kind":"learn","title":"Pasado interrogativo (con did)","blocks":[{"t":"p","x":"Ya ha visto usted lo fácil que fue, valiéndose de las palabras do y does, formar el presente interrogativo inglés."},{"t":"p","x":"Ahora bien, si el presente interrogativo inglés es fácil, el pasado interrogativo es más fácil aún, ya que, para formarlo basta colocar la palabra did delante de la frase."},{"t":"p","x":"Preg.- ¿Como se forma el pasado interrogativo ingles?"},{"t":"p","x":"Resp.- Colocando did delante de frase (La cual debe llevar el verbo en tiempo presente)."},{"t":"p","x":"Es tan sencillo interrogar con did, que bastar que el estudiante se familiarice con las formas verbales que siguen para adquirir una idea exacta de como interrogan los ingleses en tiempo pasado."},{"t":"pre","x":"We did   Nosotros hicimos\nDid we do?   ¿Hicimos nosotros?\nYou made   Usted hizo\nDid you make?   ¿Hizo usted?\nYou got   Usted consiguió\nDid you get?   ¿Consiguió ud ?\nYou said   Usted dijo\nDid you say?   ¿Dijo usted?\nWe took   Nosotros tomamos\nDid we take?   ¿Tomamos nosotros?\nShe came   Ella vino\nDid she come?   ¿Vino ella?\nHe sent   El envió\nDid he send?   ¿Envió él?\nI saw   Yo vi\nDid I see?   ¿Vi yo?"}]},{"id":"9-4","kind":"phrases","title":"Pasado interrogativo (con did): práctica","items":[{"e
